<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background: radial-gradient(1000px 600px at 50% 0%, #2a2a3a 0%, #1a1a2e 22%, #0f1f3a 48%, #051030 78%, #020810 100%);
  font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.title{font-weight:900;letter-spacing:.12em;font-size:18px;color:#fff;text-shadow:0 2px 0 #7a1200, 0 0 14px rgba(0,229,255,.7);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.title b{color:#ffd700;-webkit-text-stroke:1px #c41e00;text-shadow:0 0 12px rgba(255,215,0,.9)}
.title small{font-size:11px;letter-spacing:.08em;background:rgba(0,229,255,.18);padding:3px 8px;border-radius:999px;border:1px solid rgba(0,229,255,.4);color:#00e5ff}
.frame{position:relative;background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,229,255,.06));padding:10px;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18), 0 0 28px rgba(0,229,255,.18);backdrop-filter: blur(10px);border:1px solid rgba(0,229,255,.22)}
canvas{display:block;width:960px;height:540px;max-width:92vw;height:auto;aspect-ratio:16/9;border-radius:16px;background:#0a1020;box-shadow:inset 0 0 0 2px rgba(0,229,255,.28), 0 10px 30px rgba(0,0,0,.4);cursor:pointer}
.hud{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800}
.hudL,.hudR{display:flex;gap:8px;align-items:center}
.pill{background:rgba(12,18,32,.92);border-radius:999px;padding:6px 12px;font-size:13px;color:#00e5ff;box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;border:1px solid rgba(0,229,255,.35)}
.pill b{color:#ffd700;font-size:16px}
.pill.rank b{color:#ff3b30}
.pill.time{background: linear-gradient(180deg,#0f1f3a,#0a1020);color:#ffd700;border-color:rgba(0,229,255,.4)}
.levelTag{position:absolute;left:50%;transform:translateX(-50%);top:52px;background:linear-gradient(90deg,#c41e00,#ff6b2a);color:#fff;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.1em;box-shadow:0 3px 10px rgba(0,0,0,.4);border:1px solid rgba(255,215,0,.6)}
.controls{font-size:12px;color:#a0c8ff;background:rgba(5,16,48,.78);padding:8px 14px;border-radius:999px;border:1px solid rgba(0,229,255,.25);text-align:center}
.controls kbd{background:#0a1020;color:#00e5ff;padding:2px 6px;border-radius:6px;font-weight:900;box-shadow:0 2px 0 #000;font-size:11px;margin:0 1px;border:1px solid rgba(0,229,255,.3)}
.overlay{position:absolute;inset:10px;border-radius:16px;background: radial-gradient(600px 400px at 50% 20%, rgba(18,30,60,.98), rgba(10,16,32,.98) 45%, rgba(5,10,20,.99) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:.35s;box-shadow:inset 0 1px 0 rgba(0,229,255,.18);border:1px solid rgba(0,229,255,.18)}
.overlay.show{opacity:1;pointer-events:auto}
.overlay h2{font-size:42px;font-weight:900;letter-spacing:.06em;color:#ffd700;-webkit-text-stroke:1px #7a1200;text-shadow:0 0 14px rgba(0,229,255,.6), 0 3px 10px rgba(196,30,0,.5)}
.overlay p{color:#a0c8ff;font-weight:700;margin:6px 0 10px}
.btn{background: linear-gradient(180deg,#ff3b30,#c41e00);color:#fff;border:none;padding:12px 26px;border-radius:999px;font-weight:900;font-size:15px;letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 20px rgba(196,30,0,.45), 0 3px 0 #7a1200, inset 0 1px 0 rgba(255,255,255,.3);transition:.08s}
.btn:active{transform:scale(.96)}
.btn2{margin-top:10px;background:#0a1020;color:#00e5ff;border:1px solid rgba(0,229,255,.4);padding:8px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.btnGhost{background:#1a1a2e;color:#ffd700;border:1px solid rgba(255,215,0,.4);padding:8px 16px;border-radius:999px;font-weight:800;cursor:pointer;margin-left:8px}
.skinBar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:8px;pointer-events:auto;background:rgba(12,18,32,.92);padding:6px 10px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);border:1px solid rgba(0,229,255,.22)}
.skinBar button{width:34px;height:34px;border-radius:50%;border:3px solid #1a1a2e;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:.15s}
.skinBar button.active{transform:scale(1.18);box-shadow:0 0 0 3px #00e5ff}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">🤖 鐵金鋼派對 <b>IRON STEEL PARTY</b> <small>第四關 · 機甲出擊</small>
    <span style="display:flex;gap:6px">
      <a href="eggy_party.html" style="font-size:10px;background:#0a0a0a;color:#ffd700;padding:4px 8px;border-radius:999px;text-decoration:none;border:1px solid #ffd700">Lv1 黑仔</a>
      <a href="dragon_ball.html" style="font-size:10px;background:#ff8c00;color:#fff;padding:4px 8px;border-radius:999px;text-decoration:none">Lv2 龍珠</a>
      <a href="naruto.html" style="font-size:10px;background:#ff6b2a;color:#fff;padding:4px 8px;border-radius:999px;text-decoration:none">Lv3 火影</a>

      <p style="font-size:12px;opacity:.65;color:#6bb8ff">踩鋼鐵平台飛躍，躲機甲重錘與無人機輪胎，收集反應爐超載</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center">

<script>
const W=960,H=540;
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const timeEl=document.getElementById('timeEl');
const progEl=document.getElementById('progEl');
const rankEl=document.getElementById('rankEl');
const speedEl=document.getElementById('speedEl');
const startOverlay=document.getElementById('startOverlay');
const endOverlay=document.getElementById('endOverlay');

const WORLD={width:8000, groundY:H-80, gravity:0.60, friction:0.82, airFriction:0.98};
let gameState='start', camX=0, camY=0, time=0, frame=0, shake=0;
let reactorsCollected=0;

let actx=null;
function aEnsure(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
function tone(f,dur,type='sine',vol=0.22,slide){
  if(!actx) return; const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime+dur*0.7);
  o.start(); o.stop(actx.currentTime+dur);
}
const SFX={
  jump(){ aEnsure(); tone(520,0.13,'square',0.20,760); },
  double(){ aEnsure(); tone(680,0.12,'square',0.18,900); },
  repulse(){ aEnsure(); tone(160,0.32,'sawtooth',0.22,60); tone(320,0.28,'square',0.14); },
  bounce(){ aEnsure(); tone(460,0.14,'sine',0.2,340); },
  hit(){ aEnsure(); tone(100,0.26,'square',0.24,45); },
  reactor(){ aEnsure(); tone(700,0.09,'sine',0.2); setTimeout(()=>tone(1050,0.13,'sine',0.18),70); },
  win(){ aEnsure(); [392,523,659,880].forEach((f,i)=>setTimeout(()=>tone(f,0.26,'square',0.18), i*90)); }
};

const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function lerp(a,b,t){ return a+(b-a)*t; }

const SKINS=[
  {body:'#c41e00', belly:'#ffd700', blush:'#00e5ff', hat:'#0a1020', name:'馬克42', emblem:'42'},
  {body:'#2a2a2e', belly:'#6a6a6e', blush:'#00e5ff', hat:'#c41e00', name:'戰爭機器', emblem:'WM'},
  {body:'#0a2a6b', belly:'#6bb8ff', blush:'#ffd700', hat:'#c41e00', name:'救援', emblem:'R'},
  {body:'#8b0000', belly:'#ff4500', blush:'#ffd700', hat:'#2a2a2e', name:'浩克', aura:true, emblem:'HB'},
  {body:'#00e5ff', belly:'#a0f0ff', blush:'#ffd700', hat:'#c41e00', name:'奈米', emblem:'N'},
];
let skinIdx=0;
const player={x:80,y:WORLD.groundY-48,w:34,h:42,vx:0,vy:0,dir:1,onGround:false,coyote:0,jumpBuffer:0,jumps:0,maxJumps:2,diving:false,diveTime:0,squish:0,wobble:0,hitStun:0,skin:SKINS[0], power:0};

function resetPlayer(){
  Object.assign(player,{x:80,y:WORLD.groundY-48,w:34,h:42,vx:0,vy:0,dir:1,onGround:false,coyote:0,jumpBuffer:0,jumps:0,diving:false,diveTime:0,squish:0,wobble:0,hitStun:0,power:0});
  player.skin=SKINS[skinIdx]; reactorsCollected=0;
  bots.forEach((b,i)=>{ b.x=60+i*18; b.y=WORLD.groundY-42; b.vx=0; b.vy=0; b.onGround=true; b.jumps=0; });
}

let platforms=[], hammers=[], balls=[], trampolines=[], fans=[], coins=[], particles=[], finishX=0;

function buildLevel(){
  platforms=[]; hammers=[]; balls=[]; trampolines=[]; fans=[]; coins=[];
  platforms.push({x:0,y:WORLD.groundY,w:600,h:56,type:'ground',color:'#1a1a1e'});
  const segs=[
    {x:640,y:WORLD.groundY-28,w:210,h:20, type:'steel'},
    {x:900,y:WORLD.groundY-146,w:180,h:14, type:'steel'},
    {x:1140,y:WORLD.groundY-20,w:270,h:22, type:'steel'},
    {x:1480,y:WORLD.groundY-168,w:160,h:14, type:'steel'},
    {x:1700,y:WORLD.groundY-32,w:220,h:20, type:'steel'},
    {x:1960,y:WORLD.groundY-148,w:250,h:16, type:'steel'},
    {x:2280,y:WORLD.groundY-22,w:200,h:20, type:'steel'},
    {x:2540,y:WORLD.groundY-158,w:210,h:14, type:'steel'},
    {x:2800,y:WORLD.groundY-28,w:280,h:22, type:'steel'},
    {x:3220,y:WORLD.groundY,w:640,h:56,type:'ground',color:'#1a1a1e'},
    // 延伸：鋼鐵高空迴廊 + 機庫雙道
    {x:3600,y:WORLD.groundY-36,w:210,h:18, type:'steel'},
    {x:3840,y:WORLD.groundY-132,w:180,h:14, type:'steel'},
    {x:3840,y:WORLD.groundY-42,w:180,h:14, type:'steel'},
    {x:4080,y:WORLD.groundY-152,w:170,h:14, type:'steel'},
    {x:4320,y:WORLD.groundY-30,w:220,h:18, type:'steel'},
    {x:4560,y:WORLD.groundY-142,w:160,h:14, type:'steel'},
    {x:4800,y:WORLD.groundY-38,w:210,h:18, type:'steel'},
    {x:5040,y:WORLD.groundY-158,w:190,h:14, type:'steel'},
    {x:5040,y:WORLD.groundY-46,w:190,h:14, type:'steel'},
    {x:5280,y:WORLD.groundY-32,w:220,h:18, type:'steel'},
    {x:5520,y:WORLD.groundY-122,w:170,h:14, type:'steel'},
    {x:5800,y:WORLD.groundY-36,w:230,h:18, type:'steel'},
    {x:6080,y:WORLD.groundY-150,w:200,h:14, type:'steel'},
    {x:6360,y:WORLD.groundY-30,w:260,h:18, type:'steel'},
    {x:6900,y:WORLD.groundY,w:640,h:56,type:'ground',color:'#1a1a1e'},
  ];
  segs.forEach(s=> platforms.push(s));
  platforms.push({x:1140,y:WORLD.groundY-20,w:270,h:12,type:'seesaw',angle:0,av:0});

  trampolines.push({x:710,y:WORLD.groundY-28-14,w:60,h:14, power:16, label:'推進器'});
  trampolines.push({x:1740,y:WORLD.groundY-32-14,w:60,h:14, power:17, label:'推進器'});
  trampolines.push({x:2580,y:WORLD.groundY-68-14,w:64,h:14, power:18, label:'推進器'});

  hammers.push({x:1020,y:WORLD.groundY-170, len:116, angle:-0.7, av:0.044, dir:1, w:38,h:46, hit:0, type:'hammer'});
  hammers.push({x:2160,y:WORLD.groundY-170, len:130, angle:0.8, av:0.037, dir:-1, w:42,h:50, hit:0, type:'hammer'});

  balls.push({x:1380,y:WORLD.groundY-80,r:36,vx:-2.5, vy:0, rot:0, type:'drone'});
  balls.push({x:2420,y:WORLD.groundY-90,r:42,vx:-2.9, vy:0, rot:0, type:'drone'});
  balls.push({x:2740,y:WORLD.groundY-84,r:34,vx:2.2, vy:0, rot:0, type:'drone'});

  fans.push({x:1900,y:WORLD.groundY-120,w:18,h:90, force:-3.3, phase:0, type:'repulse'});
  fans.push({x:2320,y:WORLD.groundY-120,w:18,h:90, force:3.2, phase:1, type:'repulse'});

  // 後半程：鋼鐵高空追擊
  hammers.push({x:4320,y:WORLD.groundY-152, len:114, angle:0.6, av:0.043, dir:-1, w:38,h:46, hit:0, type:'hammer'});
  hammers.push({x:5480,y:WORLD.groundY-148, len:122, angle:-0.5, av:0.04, dir:1, w:40,h:50, hit:0, type:'hammer'});
  balls.push({x:4760,y:WORLD.groundY-82,r:36,vx:-2.6, vy:0, rot:0, type:'drone'});
  balls.push({x:5880,y:WORLD.groundY-88,r:42,vx:2.5, vy:0, rot:0, type:'drone'});
  fans.push({x:5100,y:WORLD.groundY-120,w:18,h:90, force:-3.2, phase:0, type:'repulse'});
  fans.push({x:5660,y:WORLD.groundY-120,w:18,h:90, force:3.1, phase:1, type:'repulse'});
  trampolines.push({x:4080,y:WORLD.groundY-152-14,w:60,h:14, power:16, label:'推進器'});
  trampolines.push({x:5280,y:WORLD.groundY-32-14,w:56,h:14, power:17, label:'推進器'});

  for(let i=0;i<52;i++){
    const px=560+i*120+rand(-12,12);
    const py=WORLD.groundY - rand(58,150);
    coins.push({x:px,y:py,w:18,h:18,phase:rand(0,Math.PI*2),taken:false});
  }
  finishX=7520;
}

const bots=[
  {x:40,y:WORLD.groundY-42,w:30,h:38,vx:0,vy:0,onGround:true,jumps:0,dir:1,skin:SKINS[2],speed:2.62,wobble:0,hitStun:0},
  {x:60,y:WORLD.groundY-42,w:30,h:38,vx:0,vy:0,onGround:true,jumps:0,dir:1,skin:SKINS[1],speed:2.52,wobble:0,hitStun:0},
  {x:75,y:WORLD.groundY-42,w:30,h:38,vx:0,vy:0,onGround:true,jumps:0,dir:1,skin:SKINS[3],speed:2.76,wobble:0,hitStun:0},
];

const keys={};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); keys.jump=true; player.jumpBuffer=6; }
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') doDive();
  if(e.code==='KeyR') restart();
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') keys.jump=false;
});
let touchL=false, touchR=false;
cvs.addEventListener('pointerdown',e=>{
  aEnsure();
  const r=cvs.getBoundingClientRect();
  const x=(e.clientX - r.left)/r.width * W;
  if(gameState==='start'){ startGame(); return; }
  if(gameState==='finished'){ restart(); return; }
  if(x < W*0.32) touchL=true;
  else if(x > W*0.68) touchR=true;
  else { player.jumpBuffer=6; }
});
cvs.addEventListener('pointerup',()=>{ touchL=false; touchR=false; });
cvs.addEventListener('pointercancel',()=>{ touchL=false; touchR=false; });
cvs.addEventListener('pointerleave',()=>{ touchL=false; touchR=false; });

document.getElementById('skinBar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  skinIdx=parseInt(b.dataset.skin);
  document.querySelectorAll('.skinBar button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); player.skin=SKINS[skinIdx];
});

function doJump(){
  if(player.jumps < player.maxJumps){
    const isFirst=player.jumps===0;
    player.vy=isFirst? -12.4 : -11.2;
    player.jumps++; player.onGround=false; player.coyote=0;
    player.squish=isFirst? -0.22 : -0.18; player.wobble=0.6;
    if(isFirst) SFX.jump(); else SFX.double();
    spawnPuff(player.x+player.w/2, player.y+player.h, 7, '#00e5ff');
  }
}
function doDive(){ if(player.diving||player.hitStun>0) return; player.diving=true; player.diveTime=18; player.vx+=player.dir*8.0; player.vy=Math.min(player.vy,-2)-1.6; player.squish=0.28; SFX.repulse(); spawnBeam(); }
function spawnBeam(){
  for(let i=0;i<8;i++) particles.push({x:player.x+player.w/2 + player.dir*i*14, y:player.y+player.h/2, vx:player.dir*9+rand(-1,1), vy:rand(-1.2,1.2), r:3+Math.random()*2.5, life:1, decay:0.08, color:'#00e5ff'});
}

function resolvePlatform(ent, plat){
  const ex=ent.x, ey=ent.y, ew=ent.w, eh=ent.h;
  const px=plat.x, py=plat.y, pw=plat.w, ph=plat.h;
  if(ex+ew <= px || ex >= px+pw) return false;
  const prevY=ey - ent.vy;
  if(ent.vy>=0 && prevY+eh <= py+8 && ey+eh >= py && ey+eh <= py+16){
    ent.y=py - eh; ent.vy=0; ent.onGround=true; ent.jumps=0;
    if(plat.type==='steel'){ ent.vy=-1.0; plat.squish=(plat.squish||0)+0.14; }
    if(plat.type==='seesaw'){ const c=px+pw/2; const off=(ex+ew/2-c)/(pw/2); ent.vx+=off*0.9; plat.av+=off*0.008; }
    return true;
  }
  if(ey+eh> py+6 && ey < py+ph){
    if(ex+ew>px && ex < px+pw){
      if(ent.vx>0 && ex+ew>px && ex < px){ ent.x=px-ew; ent.vx=Math.min(ent.vx,-1.2); ent.hitStun=8; }
      if(ent.vx<0 && ex < px+pw && ex+ew> px+pw){ ent.x=px+pw; ent.vx=Math.max(ent.vx,1.2); ent.hitStun=8; }
    }
  }
  return false;
}

function update(){
  if(gameState!=='playing') return;
  frame++; time+=1/60;
  let move=0;
  if(keys['ArrowLeft']||keys['KeyA']||touchL) move-=1;
  if(keys['ArrowRight']||keys['KeyD']||touchR) move+=1;
  if(move!==0) player.dir=move>0?1:-1;
  if(player.jumpBuffer>0) player.jumpBuffer--;
  if(player.onGround) player.coyote=6; else player.coyote--;
  if(player.jumpBuffer>0 && (player.onGround||player.coyote>0||player.jumps<player.maxJumps)){ doJump(); player.jumpBuffer=0; }
  const accel=player.onGround?0.95:0.42;
  const maxSpeed= player.diving? 9.0 : (reactorsCollected>=7? 5.8 : 4.6);
  player.vx+=move*accel;
  if(move===0) player.vx *= player.onGround? WORLD.friction : WORLD.airFriction;
  player.vx=clamp(player.vx,-maxSpeed,maxSpeed);
  if(reactorsCollected>=7) player.power=Math.min(1, player.power+0.010); else player.power=Math.max(0, player.power-0.012);
  if(player.power>0.45) player.vx += player.dir*0.40*player.power;
  player.vy+=WORLD.gravity;
  if(player.diving) player.vy+=0.14;
  player.vy=clamp(player.vy,-16,14);
  player.x+=player.vx; player.y+=player.vy;
  player.x=clamp(player.x,10,WORLD.width-40);
  player.onGround=false;
  if(player.y+player.h >= WORLD.groundY){
    let onPlat=false;
    for(const p of platforms){ if(player.x+player.w>p.x && player.x < p.x+p.w && Math.abs((player.y+player.h)-p.y)<12) onPlat=true; }
    const inGap=player.x>600 && player.x<640;
    if(!inGap || onPlat){
      const isSolid=(player.x<600 || player.x>3220)|| onPlat;
      if(isSolid){ player.y=WORLD.groundY-player.h; player.vy=0; player.onGround=true; player.jumps=0; if(player.diving&&player.diveTime<6) player.diving=false; }
    }
  }
  for(const p of platforms){
    if(p.type==='seesaw'){ p.angle+=p.av; p.av*=0.96; p.angle=clamp(p.angle,-0.28,0.28); }
    resolvePlatform(player,p);
    if(p.squish){ p.squish*=0.88; if(Math.abs(p.squish)<0.01) p.squish=0; }
  }
  for(const t of trampolines){
    const box={x:t.x,y:t.y-6,w:t.w,h:t.h+10};
    if(aabb(player,box) && player.vy>=0){ player.vy=-t.power; player.squish=-0.32; player.wobble=0.9; t.hit=12; SFX.bounce(); spawnPuff(t.x+t.w/2,t.y,9,'#00e5ff'); }
    if(t.hit) t.hit--;
  }
  for(const f of fans){
    f.phase+=0.06;
    if(player.x+player.w>f.x-30 && player.x < f.x+f.w+120 && player.y+f && player.y < WORLD.groundY){
      const dist=(player.x-f.x);
      const inRange=f.force>0? dist>-40&&dist<140 : dist<40&&dist>-140;
      if(inRange){ player.vx+=f.force*0.09; if(Math.abs(player.vx)<0.5) player.vx+=f.force*0.2; if(frame%4===0) particles.push({x:f.x+f.w/2+rand(-6,6),y:f.y+rand(10,70),vx:f.force*0.6+rand(-0.5,0.5),vy:rand(-1,0.5),r:2,life:1,decay:0.03,color:'rgba(0,229,255,0.7)'}); }
    }
  }
  hammers.forEach(h=>{
    h.angle+=h.av*h.dir; if(h.angle>1.0||h.angle<-1.0) h.dir*=-1;
    const hx=h.x+Math.sin(h.angle)*h.len, hy=h.y+Math.cos(h.angle)*h.len;
    const box={x:hx-h.w/2,y:hy-h.h/2,w:h.w,h:h.h};
    if(aabb(player,box)){ const d=Math.sign(player.x+player.w/2-hx)||(Math.random()>0.5?1:-1); player.vx=d*7+Math.cos(h.angle)*3; player.vy=-6+rand(-2,1); player.hitStun=18; player.wobble=1.1; player.squish=0.3; shake=10; SFX.hit(); spawnPuff(player.x+player.w/2,player.y+player.h/2,10,'#c41e00'); }
    bots.forEach(b=>{ if(aabb(b,box)){ b.vx=Math.sign(b.x-hx)*6; b.vy=-5; b.hitStun=14; b.wobble=0.8; }});
  });
  balls.forEach(b=>{
    b.x+=b.vx; b.rot+=b.vx*0.09; b.vy+=WORLD.gravity*0.55; b.y+=b.vy;
    if(b.y+b.r*2 >= WORLD.groundY){ b.y=WORLD.groundY-b.r*2; b.vy*=-0.42; if(Math.abs(b.vy)<1) b.vy=0; b.vx*=0.998; }
    if(b.x<600) { b.x=600; b.vx*=-1; }
    if(b.x>3600) { b.x=3600; b.vx*=-1; }
    const cx=b.x+b.r, cy=b.y+b.r, px=player.x+player.w/2, py=player.y+player.h/2, dx=px-cx, dy=py-cy, dist=Math.hypot(dx,dy), minD=b.r+Math.min(player.w,player.h)/2-2;
    if(dist<minD){ const nx=dx/(dist||1), ny=dy/(dist||1); player.vx=nx*6+b.vx*0.6; player.vy=ny*5-4; player.hitStun=14; shake=8; SFX.hit(); spawnPuff(px,py,8,'#00e5ff'); }
    bots.forEach(bot=>{ const bx=bot.x+bot.w/2, by=bot.y+bot.h/2, ddx=bx-cx, ddy=by-cy, dd=Math.hypot(ddx,ddy); if(dd<b.r+16){ bot.vx=(ddx/(dd||1))*5; bot.vy=-4; bot.hitStun=10; }});
  });
  coins.forEach(c=>{
    if(c.taken) return; c.phase+=0.14; c.y+=Math.sin(c.phase)*0.18;
    if(aabb(player,{x:c.x-4,y:c.y-4,w:c.w+8,h:c.h+8})){ c.taken=true; reactorsCollected++; SFX.reactor(); spawnPuff(c.x+9,c.y+9,8,'#00e5ff'); if(reactorsCollected>=7) SFX.win(); }
  });
  if(player.y>H+120){ player.x=Math.max(20,player.x-120); player.y=WORLD.groundY-80; player.vx=0; player.vy=0; player.hitStun=20; shake=6; SFX.hit(); }
  if(player.diving){ player.diveTime--; if(player.diveTime<=0||player.onGround) player.diving=false; }
  if(player.hitStun>0) player.hitStun--;
  player.wobble*=0.88; player.squish*=0.86; if(Math.abs(player.squish)<0.01) player.squish=0;
  bots.forEach(b=>{
    b.vx=lerp(b.vx,b.speed,0.08); b.vy+=WORLD.gravity;
    const ahead=b.x+42; let need=false;
    for(const p of platforms){ if(p.x>b.x && p.x< ahead+18 && p.y < b.y+b.h-6) need=true; }
    hammers.forEach(h=>{ const hx=h.x+Math.sin(h.angle)*h.len; if(Math.abs(hx-b.x)<60) need=true; });
    balls.forEach(ball=>{ if(Math.abs(ball.x-b.x)<90) need=true; });
    trampolines.forEach(t=>{ if(Math.abs(t.x-b.x)<40) need=true; });
    if(need&&b.onGround&&Math.random()<0.08){ b.vy=-11; b.onGround=false; b.wobble=0.4; }
    b.x+=b.vx; b.y+=b.vy; b.onGround=false;
    if(b.y+b.h>=WORLD.groundY){ b.y=WORLD.groundY-b.h; b.vy=0; b.onGround=true; }
    for(const p of platforms) resolvePlatform(b,p);
    for(const t of trampolines){ if(aabb(b,{x:t.x,y:t.y-6,w:t.w,h:t.h+10})&&b.vy>=0) b.vy=-t.power*0.95; }
    if(b.hitStun>0) b.hitStun--; b.wobble*=0.9;
    if(b.y>H+120){ b.x=player.x-rand(40,120); b.y=WORLD.groundY-60; b.vy=0; }
    b.x=clamp(b.x,0,WORLD.width);
  });
  if(player.x+player.w >= finishX) finishGame();
  const targetCamX=clamp(player.x-W*0.42,0,WORLD.width-W);
  camX=lerp(camX,targetCamX,0.11); camY=lerp(camY,0,0.1); if(shake>0) shake*=0.82;
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.14; p.life-=p.decay; if(p.life<=0) particles.splice(i,1); }
  if(particles.length>160) particles.splice(0,particles.length-160);
  timeEl.textContent=formatTime(time);
  const pct=Math.floor(clamp(player.x/finishX*100,0,100));
  progEl.textContent=pct+'%';
  progEl.parentElement.style.background= reactorsCollected>=7? 'linear-gradient(90deg,#00e5ff,#ffd700)' : 'rgba(12,18,32,.92)';
  const all=[player,...bots].sort((a,b)=>b.x-a.x);
  const rank=all.indexOf(player)+1;
  rankEl.textContent=rank+' / '+(bots.length+1);
  rankEl.parentElement.style.background=rank===1?'linear-gradient(180deg,#ffd700,#ff8c00)':'rgba(12,18,32,.92)';
  speedEl.textContent='⚡ '+reactorsCollected+'/7';
  speedEl.style.background=reactorsCollected>=7?'rgba(0,229,255,0.95)':'rgba(12,18,32,.92)';
  speedEl.style.color=reactorsCollected>=7?'#000':'#00e5ff';
}

function formatTime(s){ const m=Math.floor(s/60).toString().padStart(2,'0'); const sec=Math.floor(s%60).toString().padStart(2,'0'); const ms=Math.floor((s%1)*100).toString().padStart(2,'0'); return `${m}:${sec}.${ms}`; }
function spawnPuff(x,y,count=6,color='#fff'){ for(let i=0;i<count;i++) particles.push({x,y,vx:rand(-3,3),vy:rand(-5,-1),r:rand(2,4),life:1,decay:rand(0.05,0.09),color}); }

// RENDER
function draw(){

  const g=ctx.createLinearGradient(0,0,0,H);

    const x=(i*137+frame*0.16)%W, y= (Math.sin(i*0.8)*14 + 18 + (i%3)*12);
    ctx.globalAlpha=0.35+ Math.sin(frame*0.02+i)*0.2;

  }

  ctx.save(); ctx.translate(-camX*0.14,0); drawStarkSkyline(); ctx.restore(); ctx.globalAlpha=1;
  ctx.save(); ctx.translate(-camX*0.26,0);
  for(let i=0;i<4;i++){ const cx=200+i*520+Math.sin(frame*0.003+i)*16, cy=72+Math.sin(i*1.4)*10; drawCloud(cx,cy,62+i%2*12, true); }
  ctx.restore(); ctx.globalAlpha=1;
  ctx.save(); ctx.translate(-camX,-camY);
  // 地面 - 鋼鐵甲板
  ctx.globalAlpha=1;
  // 分段地面（僅實心段，空洞處顯示深淵，抬高後更易辨識）
  {
    const grounds = platforms.filter(p=>p.type==='ground').sort((a,b)=>a.x-b.x);
    grounds.forEach(g=>{ roundRect(g.x, WORLD.groundY, g.w, 28, 6); ctx.fillStyle=g.color||'#1a1a1a'; ctx.fill(); });
    // 空洞警示（在地面間隙）

    ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-1.5,-1.5,1.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,229,255,0.6)'; ctx.lineWidth=1; for(let i=0;i<3;i++){ const a=i/3*Math.PI*2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*6, Math.sin(a)*6); ctx.lineTo(Math.cos(a)*8, Math.sin(a)*8); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle='rgba(0,229,255,0.22)'; ctx.beginPath(); ctx.ellipse(c.x+9,WORLD.groundY+2,10,3,0,0,Math.PI*2); ctx.fill();
  });
  drawFinish();
  bots.forEach(b=> drawEgg(b.x,b.y,b.w,b.h,b.skin,b.dir,b.wobble,b.hitStun,0,false));
  drawEgg(player.x,player.y,player.w,player.h,player.skin,player.dir,player.wobble,player.hitStun,player.squish,player.diving);
  if(player.diving){
    ctx.strokeStyle='rgba(0,229,255,0.92)'; ctx.lineWidth=5; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(player.x+player.w/2, player.y+player.h/2); ctx.lineTo(player.x+player.w/2+player.dir*80, player.y+player.h/2+rand(-3,3)); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(player.x+player.w/2+player.dir*80, player.y+player.h/2, 9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(player.x+player.w/2+player.dir*80, player.y+player.h/2, 6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a1020'; ctx.beginPath(); ctx.arc(player.x+player.w/2+player.dir*80, player.y+player.h/2, 2.5,0,Math.PI*2); ctx.fill();
  }
  if(player.power>0.2){
    ctx.strokeStyle=`rgba(0,229,255,${0.18+player.power*0.32})`; ctx.lineWidth=2+player.power*7; ctx.beginPath(); ctx.arc(player.x+player.w/2, player.y+player.h/2, 26+player.power*13, 0, Math.PI*2); ctx.stroke();
    if(player.power>0.7){ ctx.fillStyle='rgba(255,215,0,0.22)'; ctx.beginPath(); ctx.arc(player.x+player.w/2, player.y+player.h/2-22, 10,0,Math.PI*2); ctx.fill(); }
  }
  particles.forEach(p=>{ ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1;
  ctx.restore();
  ctx.fillStyle='rgba(0,229,255,0.08)'; ctx.fillRect(0,0,W,8);
  ctx.restore();
}
function drawStarkSkyline(){
  ctx.fillStyle='#0f1f3a';
  ctx.beginPath(); ctx.moveTo(-200, 148);
  for(let x=-200;x<W+400;x+=80){
    const h= 38 + Math.sin(x*0.012)*14 + (x%160<40? 22:0) + (x%320<20? 30:0);
    ctx.lineTo(x, 148 - h); ctx.lineTo(x+28, 148 - h*0.7);
  }
  ctx.lineTo(W+400, 200); ctx.lineTo(-200,200); ctx.closePath(); ctx.fill();
  // 窗口
  for(let x=-140;x<W+340;x+=90){
    for(let y=0;y<4;y++){
      if((x+y)%3===0) continue;
      ctx.fillStyle = y%2===0? 'rgba(0,229,255,0.85)' : 'rgba(255,215,0,0.7)';
      if(Math.random()<0.35) continue;
      ctx.fillRect(x+rand(8,48), 86+y*14+rand(-1,1), rand(7,16), 6);
    }
  }
  // 史塔克大樓
  ctx.fillStyle='#1a2a5a'; ctx.fillRect(W-280, 42, 54, 106);
  ctx.fillStyle='#0a1020'; ctx.fillRect(W-276, 48, 46, 8);
  ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(W-253, 68, 8,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(W-255,66,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd700'; ctx.font='bold 7px sans-serif'; ctx.textAlign='center'; ctx.fillText('STARK', W-253, 92);
  ctx.fillStyle='rgba(0,229,255,0.4)'; ctx.fillRect(W-284, 138, 62, 3);
  // 第二塔
  ctx.fillStyle='#1f1f2e'; ctx.fillRect(180, 68, 48, 80); ctx.fillStyle='#00e5ff'; ctx.fillRect(186, 74, 36, 4);
}
function drawCloud(x,y,s, isDark=false){
  if(isDark){
    ctx.fillStyle='rgba(18,28,48,0.85)';
    ctx.beginPath(); ctx.ellipse(x,y,s*0.42,s*0.22,0,0,Math.PI*2); ctx.ellipse(x+s*0.22,y-4,s*0.28,s*0.18,0,0,Math.PI*2); ctx.ellipse(x-s*0.18,y-2,s*0.24,s*0.16,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,229,255,0.06)'; ctx.beginPath(); ctx.ellipse(x,y+6,s*0.44,6,0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.beginPath(); ctx.ellipse(x,y,s*0.42,s*0.32,0,0,Math.PI*2); ctx.ellipse(x+s*0.28,y-8,s*0.32,s*0.36,0,0,Math.PI*2); ctx.ellipse(x-s*0.26,y-4,s*0.30,s*0.26,0,0,Math.PI*2); ctx.fill();
  }
}
function drawSteelPlatform(x,y,w,h,squish=0){
  ctx.save(); ctx.translate(x+w/2, y+h/2); ctx.scale(1+squish*0.10, 1-squish*0.14); ctx.translate(-w/2,-h/2);
  ctx.fillStyle='#1a2332'; roundRect(0,0,w,h,8); ctx.fill();
  ctx.strokeStyle='rgba(0,229,255,0.45)'; ctx.lineWidth=1.6; roundRect(0,0,w,h,8); ctx.stroke();
  ctx.strokeStyle='rgba(255,215,0,0.18)'; ctx.lineWidth=1; ctx.setLineDash([8,6]); roundRect(0,0,w,h,8); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.06)'; roundRect(2,2,w-4,4,6); ctx.fill();
  // 鉚釘
  ctx.fillStyle='rgba(0,229,255,0.5)'; ctx.beginPath(); ctx.arc(6,6,2,0,Math.PI*2); ctx.arc(w-6,6,2,0,Math.PI*2); ctx.arc(6,h-6,2,0,Math.PI*2); ctx.arc(w-6,h-6,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.35)'; roundRect(0,h-6,w,6,6); ctx.fill();
  // 鋼印
  ctx.fillStyle='rgba(0,229,255,0.12)'; ctx.font='bold 6px sans-serif'; ctx.textAlign='center'; ctx.fillText('STARK', w/2, h/2+2);
  ctx.restore();
  ctx.fillStyle='rgba(0,229,255,0.18)'; ctx.beginPath(); ctx.ellipse(x+w/2, WORLD.groundY+3, w*0.42, 3.5,0,0,Math.PI*2); ctx.fill();
}
function drawFinish(){
  const fx=finishX;
  ctx.shadowColor='rgba(0,229,255,0.6)'; ctx.shadowBlur=16;
  ctx.fillStyle='#c41e00'; roundRect(fx-16, WORLD.groundY-152, 28,152,8); ctx.fill();
  ctx.fillStyle='#1a2332'; roundRect(fx+16, WORLD.groundY-152, 28,152,8); ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,229,255,0.6)'; ctx.lineWidth=2; roundRect(fx-16, WORLD.groundY-152, 28,152,8); ctx.stroke(); roundRect(fx+16, WORLD.groundY-152, 28,152,8); ctx.stroke();
  ctx.fillStyle='#0a1020'; roundRect(fx-40, WORLD.groundY-164, 112, 26, 10); ctx.fill(); ctx.strokeStyle='rgba(0,229,255,0.7)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle='#00e5ff'; ctx.font='900 13px sans-serif'; ctx.textAlign='center'; ctx.fillText('GOAL', fx+13, WORLD.groundY-147);
  ctx.fillStyle='#ffd700'; ctx.font='bold 7px sans-serif'; ctx.fillText('STARK', fx+13, WORLD.groundY-137);
  ctx.save(); ctx.translate(fx+13, WORLD.groundY-186); const bob=Math.sin(frame*0.06)*3; ctx.translate(0,bob);
  // 鋼鐵頭盔
  ctx.fillStyle='#c41e00'; ctx.strokeStyle='#0a1020'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(0,0,26,18,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.fillRect(-14,-2,28,4);
  ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=8; ctx.beginPath(); ctx.ellipse(-8,-4,5,3,0,0,Math.PI*2); ctx.ellipse(8,-4,5,3,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#0a1020'; ctx.beginPath(); ctx.ellipse(0,6,6,3,0,0,Math.PI*2); ctx.fill();
  // 反應爐光環
  ctx.strokeStyle='rgba(0,229,255,0.45)'; ctx.lineWidth=1.5; for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+frame*0.04; ctx.beginPath(); ctx.arc(Math.cos(a)*32, Math.sin(a)*14, 3,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle='rgba(0,229,255,0.14)'; ctx.fillRect(fx-64, WORLD.groundY, 128, 3);
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?'#00e5ff':'#0a1020'; ctx.fillRect(fx-44+i*11, WORLD.groundY-12,11,12); }
}
function drawEgg(x,y,w,h,skin,dir,wobble,hitStun,squish=0,diving=false){
  const isGold=skin.name==='浩克' || skin.name==='奈米';
  ctx.save(); ctx.translate(x+w/2, y+h/2);
  const wob=Math.sin(frame*0.3+x*0.01)*wobble*0.08;
  const hit=hitStun>0?Math.sin(frame*0.9)*0.12:0;
  const sx=1+(squish||0)+wob+hit, sy=1-(squish||0)*0.7 -wob*0.5+hit*0.5;
  const rot=diving?dir*0.9:(wobble*0.08*dir)+(hitStun?Math.sin(frame*0.5)*0.12:0);
  ctx.rotate(rot); ctx.scale(sx,sy);
  if(skin.name==='浩克'){ ctx.shadowColor='#00e5ff'; ctx.shadowBlur=14; }
  ctx.fillStyle='rgba(0,0,0,0.42)'; ctx.beginPath(); ctx.ellipse(0,h/2+8,w*0.45,5,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  const r=w/2; ctx.fillStyle=skin.body; roundRect(-w/2,-h/2,w,h,r); ctx.fill();
  // 鋼鐵接縫
  ctx.strokeStyle='rgba(0,229,255,0.28)'; ctx.lineWidth=1; roundRect(-w/2+1,-h/2+1,w-2,h-2,r-1); ctx.stroke();
  ctx.fillStyle=skin.belly; ctx.beginPath(); ctx.ellipse(0,6,w*0.30,h*0.22,0,0,Math.PI*2); ctx.fill();
  // 方舟反應爐
  ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=6; ctx.beginPath(); ctx.arc(0,6,5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-1,5,1.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(-w*0.22,-h*0.28,5,9,-0.3,0,Math.PI*2); ctx.fill();
  // 面罩
  const eyeY=-6, eyeDx=7;
  if(diving){
    ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=8; ctx.beginPath(); ctx.ellipse(0,4,9,4,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,4,5,2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c41e00'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-eyeDx-3, eyeY-1); ctx.lineTo(-eyeDx+3, eyeY+1); ctx.moveTo(eyeDx-3, eyeY+1); ctx.lineTo(eyeDx+3, eyeY-1); ctx.stroke();
  } else if(hitStun>0){
    ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.arc(-eyeDx,eyeY,4,0,Math.PI*2); ctx.arc(eyeDx,eyeY,4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(-eyeDx,eyeY,1.6,0,Math.PI*2); ctx.arc(eyeDx,eyeY,1.6,0,Math.PI*2); ctx.fill();
  } else {
    // 鋼鐵眼
    ctx.fillStyle='#0a1020'; ctx.beginPath(); ctx.ellipse(-eyeDx,eyeY,5,3,0,0,Math.PI*2); ctx.ellipse(eyeDx,eyeY,5,3,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#00e5ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=6; ctx.beginPath(); ctx.ellipse(-eyeDx,eyeY,3.5,1.8,0,0,Math.PI*2); ctx.ellipse(eyeDx,eyeY,3.5,1.8,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(-eyeDx-0.5,eyeY-0.8,1.4,0.8,0,0,Math.PI*2); ctx.ellipse(eyeDx-0.5,eyeY-0.8,1.4,0.8,0,0,Math.PI*2); ctx.fill();
  }
  // 頭盔線條
  ctx.strokeStyle='rgba(255,215,0,0.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-w*0.28,-h*0.18); ctx.lineTo(0,-h*0.34); ctx.lineTo(w*0.28,-h*0.18); ctx.stroke();
  ctx.fillStyle='#0a1020'; ctx.font='bold 6px sans-serif'; ctx.textAlign='center'; ctx.fillText(skin.emblem||'42',0,10);
  ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.font='600 5px sans-serif'; ctx.fillText('STARK',0,16);
  const swing=Math.sin(frame*0.22+x*0.02)*(hitStun?0:1);
  ctx.fillStyle=skin.body; ctx.strokeStyle='rgba(0,229,255,0.2)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.ellipse(-w/2-3+swing*1.2,-2,5,7,-0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(w/2+3-swing*1.2,-2,5,7,0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // 推進器腳
  ctx.fillStyle='#0a1020'; ctx.beginPath(); ctx.ellipse(-w*0.22,h/2+2,7,4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(w*0.22,h/2+2,7,4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle= hitStun? '#c41e00' : '#00e5ff'; 
  if(!hitStun && frame%6<3){ ctx.shadowColor='#00e5ff'; ctx.shadowBlur=6; ctx.beginPath(); ctx.ellipse(-w*0.22,h/2+5,3,2,0,0,Math.PI*2); ctx.ellipse(w*0.22,h/2+5,3,2,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function starPath(x,y,R,r,n){ ctx.beginPath(); for(let i=0;i<n*2;i++){ const rad=(i*Math.PI/n)-Math.PI/2; const rad2=i%2?r:R; ctx.lineTo(x+Math.cos(rad)*rad2, y+Math.sin(rad)*rad2);} ctx.closePath(); }
function startGame(){ gameState='playing'; time=0; frame=0; camX=0; camY=0; shake=0; reactorsCollected=0; resetPlayer(); buildLevel(); startOverlay.style.opacity='0'; startOverlay.style.pointerEvents='none'; startOverlay.style.display='none'; endOverlay.classList.remove('show'); aEnsure(); }
function finishGame(){ if(gameState==='finished') return; gameState='finished'; const all=[player,...bots].sort((a,b)=>b.x-a.x); const rank=all.indexOf(player)+1; const tStr=formatTime(time); document.getElementById('endIcon').textContent=rank===1?'🤖': rank<=2?'🥈':'💥'; document.getElementById('endTitle').textContent=rank===1?'鋼鐵勝利！': rank===2?'就差一步！':'需要升級！'; document.getElementById('endDesc').textContent=`用時 ${tStr} · 排名 ${rank} / ${all.length} · 反應爐 ${reactorsCollected}/7`; endOverlay.classList.add('show'); if(rank===1) SFX.win(); else SFX.hit(); for(let i=0;i<18;i++) spawnPuff(player.x+rand(-20,20),player.y+rand(-20,10),1,['#00e5ff','#ffd700','#c41e00'][i%3]); }
function restart(){ startGame(); }
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', restart);
document.getElementById('shareBtn').addEventListener('click', ()=>{ const data=cvs.toDataURL('image/png'); const w=window.open(); w.document.write('<img src="'+data+'" style="width:100%;background:#020810">'); });
window.addEventListener('keydown',e=>{ if(e.code==='Enter'&&gameState==='start') startGame(); });
buildLevel(); resetPlayer();
function loop(){ update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
