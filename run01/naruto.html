<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background: radial-gradient(1000px 600px at 50% 0%, #ff6b2a 0%, #ff8c42 18%, #6bb8ff 42%, #1a4fa3 72%, #0a1940 100%);
  font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.title{font-weight:900;letter-spacing:.12em;font-size:18px;color:#fff;text-shadow:0 2px 0 #c41e00, 0 0 12px rgba(255,107,42,.8);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.title b{color:#ffd700;-webkit-text-stroke:1px #0a1940;text-shadow:0 0 10px rgba(255,215,0,.9)}
.title small{font-size:11px;letter-spacing:.08em;background:rgba(255,215,0,.22);padding:3px 8px;border-radius:999px;border:1px solid rgba(255,215,0,.4);color:#fff}
.frame{position:relative;background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,107,42,.12));padding:10px;border-radius:22px;box-shadow:0 24px 60px rgba(60,20,0,.45), inset 0 1px 0 rgba(255,255,255,.6), 0 0 24px rgba(255,107,42,.25);backdrop-filter: blur(10px);border:1px solid rgba(255,215,0,.28)}
canvas{display:block;width:960px;height:540px;max-width:92vw;height:auto;aspect-ratio:16/9;border-radius:16px;background:#87ceeb;box-shadow:inset 0 0 0 2px rgba(255,215,0,.35), 0 10px 30px rgba(0,0,0,.25);cursor:pointer}
.hud{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;pointer-events:none;font-weight:800}
.hudL,.hudR{display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.94);border-radius:999px;padding:6px 12px;font-size:13px;color:#4a1a00;box-shadow:0 4px 14px rgba(0,0,0,.2), inset 0 1px 0 #fff;display:flex;align-items:center;gap:6px;border:2px solid rgba(255,107,42,.35)}
.pill b{color:#c41e00;font-size:16px}
.pill.rank b{color:#1a4fa3}
.pill.time{background: linear-gradient(180deg,#fff,#ffe0b3);color:#c41e00}
.levelTag{position:absolute;left:50%;transform:translateX(-50%);top:52px;background:linear-gradient(90deg,#c41e00,#ff6b2a);color:#fff;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.1em;box-shadow:0 3px 10px rgba(0,0,0,.3);border:1px solid rgba(255,215,0,.6)}
.controls{font-size:12px;color:#fff;background:rgba(60,20,0,.45);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);text-align:center}
.controls kbd{background:#fff;color:#4a1a00;padding:2px 6px;border-radius:6px;font-weight:900;box-shadow:0 2px 0 #c68a00;font-size:11px;margin:0 1px}
.overlay{position:absolute;inset:10px;border-radius:16px;background: radial-gradient(600px 400px at 50% 20%, rgba(255,255,255,.96), rgba(255,238,200,.96) 45%, rgba(255,180,80,.96) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:.35s;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);border:1px solid rgba(255,107,42,.25)}
.overlay.show{opacity:1;pointer-events:auto}
.overlay h2{font-size:42px;font-weight:900;letter-spacing:.06em;color:#c41e00;-webkit-text-stroke:1.2px #ffd700;text-shadow:0 3px 10px rgba(196,30,0,.35)}
.overlay p{color:#6b3a00;font-weight:700;margin:6px 0 10px}
.btn{background: linear-gradient(180deg,#ff6b2a,#c41e00);color:#fff;border:none;padding:12px 26px;border-radius:999px;font-weight:900;font-size:15px;letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 20px rgba(196,30,0,.45), 0 3px 0 #7a1200, inset 0 1px 0 rgba(255,255,255,.4);transition:.08s}
.btn:active{transform:scale(.96)}
.btn2{margin-top:10px;background:#fff;color:#7a1200;border:2px solid #ff6b2a;padding:8px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.btnGhost{background:#0a1940;color:#ffd700;border:1px solid #ffd700;padding:8px 16px;border-radius:999px;font-weight:800;cursor:pointer;margin-left:8px}
.skinBar{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:8px;pointer-events:auto;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);border:1px solid rgba(255,107,42,.25)}
.skinBar button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:.15s}
.skinBar button.active{transform:scale(1.18);box-shadow:0 0 0 3px #c41e00}
.navLinks{position:absolute;right:12px;top:12px;display:flex;gap:6px;pointer-events:auto}
.navLinks a{font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#ffd700;border:1px solid rgba(255,215,0,.4);text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">🍥 火影派對 <b>NARUTO PARTY</b> <small>第三關 · 木葉修行</small>
    <span style="display:flex;gap:6px;flex-wrap:wrap">
      <a href="eggy_party.html" style="font-size:10px;background:#0a0a0a;color:#ffd700;padding:4px 8px;border-radius:999px;text-decoration:none;border:1px solid #ffd700">Lv1 黑仔</a>
      <a href="dragon_ball.html" style="font-size:10px;background:#ff8c00;color:#fff;padding:4px 8px;border-radius:999px;text-decoration:none;border:1px solid #fff">Lv2 龍珠</a>
      <a href="iron_man.html" style="font-size:10px;background:linear-gradient(90deg,#c41e00,#00e5ff);color:#fff;padding:4px 8px;border-radius:999px;text-decoration:none;border:1px solid #00e5ff">🤖 Lv4 鐵金鋼</a>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="startBtn">▶ 影分身出發</button>
        <button class="btnGhost" onclick="location.href='dragon_ball.html'">← Lv2</button>

        <button class="btn" style="background:linear-gradient(180deg,#c41e00,#00e5ff);color:#fff;border:none;padding:8px 16px;border-radius:999px;font-weight:800;cursor:pointer" onclick="location.href='iron_man.html'">🤖 Lv4 鐵金鋼 →</button>
      </div>
      <div style="margin-top:10px;font-size:11px;color:#a06b2a">操作：A/D移動 · 空白/↑跳躍 · Shift 螺旋丸衝刺 · 集齊拉麵九尾化</div>

    <div class="overlay" id="endOverlay">

  <div class="controls">

<script>
const W=960,H=540;
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const timeEl=document.getElementById('timeEl');
const progEl=document.getElementById('progEl');
const rankEl=document.getElementById('rankEl');
const speedEl=document.getElementById('speedEl');
const startOverlay=document.getElementById('startOverlay');
const endOverlay=document.getElementById('endOverlay');

const WORLD={width:7800, groundY:H-80, gravity:0.60, friction:0.82, airFriction:0.98};
let gameState='start', camX=0, camY=0, time=0, frame=0, shake=0;
let ramenCollected=0;

let actx=null;
function aEnsure(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
function tone(f,dur,type='sine',vol=0.22,slide){
  if(!actx) return; const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
  g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime+dur*0.7);
  o.start(); o.stop(actx.currentTime+dur);
}
const SFX={
  jump(){ aEnsure(); tone(540,0.14,'square',0.22,780); },
  double(){ aEnsure(); tone(680,0.12,'square',0.18,920); },
  rasengan(){ aEnsure(); tone(220,0.35,'sawtooth',0.2,80); tone(440,0.3,'square',0.14); },
  bounce(){ aEnsure(); tone(480,0.15,'sine',0.2,360); },
  hit(){ aEnsure(); tone(110,0.26,'square',0.24,50); },
  ramen(){ aEnsure(); tone(600,0.09,'sine',0.2); setTimeout(()=>tone(900,0.14,'sine',0.18),70); },
  win(){ aEnsure(); [392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.28,'square',0.18), i*95)); }
};

const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function lerp(a,b,t){ return a+(b-a)*t; }

const SKINS=[
  {body:'#ff6b2a', belly:'#ffd9a0', blush:'#c41e00', hat:'#0a1940', hair:'#ffd700', name:'鳴人', emblem:'渦'},
  {body:'#1a1a2e', belly:'#2a2a4a', blush:'#ff6b2a', hat:'#c41e00', hair:'#0a0a2a', name:'佐助', emblem:'宇'},
  {body:'#2d5a27', belly:'#a0d0a0', blush:'#ff6b2a', hat:'#0a1940', hair:'#ff1493', name:'小櫻', emblem:'春'},
  {body:'#ffd700', belly:'#fff8b0', blush:'#c41e00', hat:'#c41e00', hair:'#ff4500', name:'九尾', aura:true, emblem:'九'},
  {body:'#0a0a0a', belly:'#1a1a1a', blush:'#ff0040', hat:'#c41e00', hair:'#c41e00', name:'曉', emblem:'曉'},
];
let skinIdx=0;
const player={x:80,y:WORLD.groundY-48,w:34,h:42,vx:0,vy:0,dir:1,onGround:false,coyote:0,jumpBuffer:0,jumps:0,maxJumps:2,diving:false,diveTime:0,squish:0,wobble:0,hitStun:0,skin:SKINS[0], power:0};

function resetPlayer(){
  Object.assign(player,{x:80,y:WORLD.groundY-48,w:34,h:42,vx:0,vy:0,dir:1,onGround:false,coyote:0,jumpBuffer:0,jumps:0,diving:false,diveTime:0,squish:0,wobble:0,hitStun:0,power:0});
  player.skin=SKINS[skinIdx]; ramenCollected=0;
  bots.forEach((b,i)=>{ b.x=60+i*18; b.y=WORLD.groundY-42; b.vx=0; b.vy=0; b.onGround=true; b.jumps=0; });
}

let platforms=[], hammers=[], balls=[], trampolines=[], fans=[], coins=[], particles=[], finishX=0;

function buildLevel(){
  platforms=[]; hammers=[]; balls=[]; trampolines=[]; fans=[]; coins=[];
  platforms.push({x:0,y:WORLD.groundY,w:580,h:56,type:'ground',color:'#8b4513'});
  const segs=[
    {x:620,y:WORLD.groundY-26,w:210,h:20, type:'roof'},
    {x:880,y:WORLD.groundY-144,w:180,h:14, type:'roof'},
    {x:1120,y:WORLD.groundY-18,w:270,h:22, type:'roof'},
    {x:1460,y:WORLD.groundY-164,w:160,h:14, type:'roof'},
    {x:1680,y:WORLD.groundY-32,w:220,h:20, type:'roof'},
    {x:1940,y:WORLD.groundY-142,w:240,h:16, type:'roof'},
    {x:2260,y:WORLD.groundY-20,w:200,h:20, type:'roof'},
    {x:2520,y:WORLD.groundY-152,w:200,h:14, type:'roof'},
    {x:2780,y:WORLD.groundY-26,w:270,h:22, type:'roof'},
    {x:3160,y:WORLD.groundY,w:620,h:56,type:'ground',color:'#8b4513'},
    // 延伸：木葉高低雙道 + 螺旋橋
    {x:3540,y:WORLD.groundY-36,w:200,h:18, type:'roof'},
    {x:3780,y:WORLD.groundY-126,w:180,h:14, type:'roof'},
    {x:3780,y:WORLD.groundY-40,w:180,h:14, type:'roof'},
    {x:4020,y:WORLD.groundY-150,w:170,h:14, type:'roof'},
    {x:4260,y:WORLD.groundY-28,w:220,h:18, type:'roof'},
    {x:4500,y:WORLD.groundY-136,w:160,h:14, type:'roof'},
    {x:4740,y:WORLD.groundY-34,w:210,h:18, type:'roof'},
    {x:4980,y:WORLD.groundY-158,w:190,h:14, type:'roof'},
    {x:4980,y:WORLD.groundY-44,w:190,h:14, type:'roof'},
    {x:5220,y:WORLD.groundY-30,w:220,h:18, type:'roof'},
    {x:5460,y:WORLD.groundY-118,w:170,h:14, type:'roof'},
    {x:5740,y:WORLD.groundY-36,w:230,h:18, type:'roof'},
    {x:6020,y:WORLD.groundY-148,w:200,h:14, type:'roof'},
    {x:6300,y:WORLD.groundY-28,w:260,h:18, type:'roof'},
    {x:6800,y:WORLD.groundY,w:620,h:56,type:'ground',color:'#8b4513'},
  ];
  segs.forEach(s=> platforms.push(s));
  platforms.push({x:1120,y:WORLD.groundY-18,w:270,h:12,type:'seesaw',angle:0,av:0});

  trampolines.push({x:690,y:WORLD.groundY-26-14,w:60,h:14, power:16, label:'蛙跳'});
  trampolines.push({x:1720,y:WORLD.groundY-32-14,w:60,h:14, power:17, label:'蛙跳'});
  trampolines.push({x:2560,y:WORLD.groundY-66-14,w:64,h:14, power:18, label:'蛙跳'});

  hammers.push({x:1010,y:WORLD.groundY-170, len:114, angle:-0.7, av:0.044, dir:1, w:36,h:44, hit:0, type:'shuriken'});
  hammers.push({x:2140,y:WORLD.groundY-170, len:128, angle:0.8, av:0.037, dir:-1, w:40,h:48, hit:0, type:'shuriken'});

  balls.push({x:1360,y:WORLD.groundY-80,r:35,vx:-2.4, vy:0, rot:0, type:'shuriken'});
  balls.push({x:2400,y:WORLD.groundY-90,r:40,vx:-2.8, vy:0, rot:0, type:'rasengan'});
  balls.push({x:2720,y:WORLD.groundY-84,r:33,vx:2.1, vy:0, rot:0, type:'shuriken'});

  fans.push({x:1880,y:WORLD.groundY-120,w:18,h:90, force:-3.3, phase:0, type:'wind'});
  fans.push({x:2300,y:WORLD.groundY-120,w:18,h:90, force:3.1, phase:1, type:'wind'});

  // 後半程：高低木葉 + 追加手裏劍
  hammers.push({x:4380,y:WORLD.groundY-150, len:112, angle:0.6, av:0.042, dir:-1, w:36,h:44, hit:0, type:'shuriken'});
  hammers.push({x:5530,y:WORLD.groundY-145, len:120, angle:-0.5, av:0.04, dir:1, w:38,h:46, hit:0, type:'shuriken'});
  balls.push({x:4740,y:WORLD.groundY-82,r:34,vx:-2.5, vy:0, rot:0, type:'shuriken'});
  balls.push({x:5920,y:WORLD.groundY-88,r:38,vx:2.6, vy:0, rot:0, type:'rasengan'});
  fans.push({x:5120,y:WORLD.groundY-120,w:18,h:90, force:-3.2, phase:0, type:'wind'});
  fans.push({x:5740,y:WORLD.groundY-120,w:18,h:90, force:3.1, phase:1, type:'wind'});
  trampolines.push({x:4020,y:WORLD.groundY-150-14,w:60,h:14, power:16, label:'蛙跳'});
  trampolines.push({x:5220,y:WORLD.groundY-30-14,w:56,h:14, power:17, label:'蛙跳'});

  for(let i=0;i<52;i++){
    const px=540+i*118+rand(-12,12);
    const py=WORLD.groundY - rand(58,148);
    coins.push({x:px,y:py,w:18,h:18,phase:rand(0,Math.PI*2),taken:false});
  }
  finishX=7320;
}

const bots=[
  {x:40,y:WORLD.groundY-42,w:30,h:38,vx:0,vy:0,onGround:true,jumps:0,dir:1,skin:SKINS[2],speed:2.60,wobble:0,hitStun:0},
  {x:60,y:WORLD.groundY-42,w:30,h:38,vx:0,vy:0,onGround:true,jumps:0,dir:1,skin:SKINS[1],speed:2.50,wobble:0,hitStun:0},
  {x:75,y:WORLD.groundY-42,w:30,h:38,vx:0,vy:0,onGround:true,jumps:0,dir:1,skin:SKINS[3],speed:2.74,wobble:0,hitStun:0},
];

const keys={};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){ e.preventDefault(); keys.jump=true; player.jumpBuffer=6; }
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') doDive();
  if(e.code==='KeyR') restart();
  keys[e.code]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') keys.jump=false;
});
let touchL=false, touchR=false;
cvs.addEventListener('pointerdown',e=>{
  aEnsure();
  const r=cvs.getBoundingClientRect();
  const x=(e.clientX - r.left)/r.width * W;
  if(gameState==='start'){ startGame(); return; }
  if(gameState==='finished'){ restart(); return; }
  if(x < W*0.32) touchL=true;
  else if(x > W*0.68) touchR=true;
  else { player.jumpBuffer=6; }
});
cvs.addEventListener('pointerup',()=>{ touchL=false; touchR=false; });
cvs.addEventListener('pointercancel',()=>{ touchL=false; touchR=false; });
cvs.addEventListener('pointerleave',()=>{ touchL=false; touchR=false; });

document.getElementById('skinBar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  skinIdx=parseInt(b.dataset.skin);
  document.querySelectorAll('.skinBar button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); player.skin=SKINS[skinIdx];
});

function doJump(){
  if(player.jumps < player.maxJumps){
    const isFirst=player.jumps===0;
    player.vy=isFirst? -12.4 : -11.2;
    player.jumps++; player.onGround=false; player.coyote=0;
    player.squish=isFirst? -0.22 : -0.18; player.wobble=0.6;
    if(isFirst) SFX.jump(); else SFX.double();
    spawnPuff(player.x+player.w/2, player.y+player.h, 7, '#ff6b2a');
  }
}
function doDive(){ if(player.diving||player.hitStun>0) return; player.diving=true; player.diveTime=18; player.vx+=player.dir*7.8; player.vy=Math.min(player.vy,-2)-1.6; player.squish=0.28; SFX.rasengan(); spawnBeam(); }
function spawnBeam(){

function resolvePlatform(ent, plat){
  const ex=ent.x, ey=ent.y, ew=ent.w, eh=ent.h;
  const px=plat.x, py=plat.y, pw=plat.w, ph=plat.h;
  if(ex+ew <= px || ex >= px+pw) return false;
  const prevY=ey - ent.vy;
  if(ent.vy>=0 && prevY+eh <= py+8 && ey+eh >= py && ey+eh <= py+16){
    ent.y=py - eh; ent.vy=0; ent.onGround=true; ent.jumps=0;
    if(plat.type==='roof'){ ent.vy=-1.0; plat.squish=(plat.squish||0)+0.14; }
    if(plat.type==='seesaw'){ const c=px+pw/2; const off=(ex+ew/2-c)/(pw/2); ent.vx+=off*0.9; plat.av+=off*0.008; }
    return true;
  }
  if(ey+eh> py+6 && ey < py+ph){
    if(ex+ew>px && ex < px+pw){
      if(ent.vx>0 && ex+ew>px && ex < px){ ent.x=px-ew; ent.vx=Math.min(ent.vx,-1.2); ent.hitStun=8; }
      if(ent.vx<0 && ex < px+pw && ex+ew> px+pw){ ent.x=px+pw; ent.vx=Math.max(ent.vx,1.2); ent.hitStun=8; }
    }
  }
  return false;
}

function update(){
  if(gameState!=='playing') return;
  frame++; time+=1/60;
  let move=0;
  if(keys['ArrowLeft']||keys['KeyA']||touchL) move-=1;
  if(keys['ArrowRight']||keys['KeyD']||touchR) move+=1;
  if(move!==0) player.dir=move>0?1:-1;
  if(player.jumpBuffer>0) player.jumpBuffer--;
  if(player.onGround) player.coyote=6; else player.coyote--;

  const accel=player.onGround?0.95:0.42;
  const maxSpeed= player.diving? 8.8 : (ramenCollected>=7? 5.7 : 4.6);
  player.vx+=move*accel;
  if(move===0) player.vx *= player.onGround? WORLD.friction : WORLD.airFriction;
  player.vx=clamp(player.vx,-maxSpeed,maxSpeed);
  if(ramenCollected>=7) player.power=Math.min(1, player.power+0.009); else player.power=Math.max(0, player.power-0.012);
  if(player.power>0.45) player.vx += player.dir*0.38*player.power;
  player.vy+=WORLD.gravity;
  if(player.diving) player.vy+=0.14;
  player.vy=clamp(player.vy,-16,14);
  player.x+=player.vx; player.y+=player.vy;
  player.x=clamp(player.x,10,WORLD.width-40);
  player.onGround=false;
  if(player.y+player.h >= WORLD.groundY){
    let onPlat=false;
    for(const p of platforms){ if(player.x+player.w>p.x && player.x < p.x+p.w && Math.abs((player.y+player.h)-p.y)<12) onPlat=true; }
    const inGap=player.x>580 && player.x<620;
    if(!inGap || onPlat){
      const isSolid=(player.x<580 || player.x>3160)|| onPlat;
      if(isSolid){ player.y=WORLD.groundY-player.h; player.vy=0; player.onGround=true; player.jumps=0; if(player.diving&&player.diveTime<6) player.diving=false; }
    }
  }
  for(const p of platforms){
    if(p.type==='seesaw'){ p.angle+=p.av; p.av*=0.96; p.angle=clamp(p.angle,-0.28,0.28); }
    resolvePlatform(player,p);
    if(p.squish){ p.squish*=0.88; if(Math.abs(p.squish)<0.01) p.squish=0; }
  }
  for(const t of trampolines){
    const box={x:t.x,y:t.y-6,w:t.w,h:t.h+10};
    if(aabb(player,box) && player.vy>=0){ player.vy=-t.power; player.squish=-0.32; player.wobble=0.9; t.hit=12; SFX.bounce(); spawnPuff(t.x+t.w/2,t.y,9,'#6bb8ff'); }

  }
  for(const f of fans){
    f.phase+=0.06;
    if(player.x+player.w>f.x-30 && player.x < f.x+f.w+120 && player.y+f && player.y < WORLD.groundY){
      const dist=(player.x-f.x);
      const inRange=f.force>0? dist>-40&&dist<140 : dist<40&&dist>-140;
      if(inRange){ player.vx+=f.force*0.09; if(Math.abs(player.vx)<0.5) player.vx+=f.force*0.2; if(frame%4===0) particles.push({x:f.x+f.w/2+rand(-6,6),y:f.y+rand(10,70),vx:f.force*0.6+rand(-0.5,0.5),vy:rand(-1,0.5),r:2,life:1,decay:0.03,color:'rgba(107,184,255,0.7)'}); }
    }
  }
  hammers.forEach(h=>{
    h.angle+=h.av*h.dir; if(h.angle>1.0||h.angle<-1.0) h.dir*=-1;

    const box={x:hx-h.w/2,y:hy-h.h/2,w:h.w,h:h.h};
    if(aabb(player,box)){ const d=Math.sign(player.x+player.w/2-hx)||(Math.random()>0.5?1:-1); player.vx=d*7+Math.cos(h.angle)*3; player.vy=-6+rand(-2,1); player.hitStun=18; player.wobble=1.1; player.squish=0.3; shake=10; SFX.hit(); spawnPuff(player.x+player.w/2,player.y+player.h/2,10,'#c41e00'); }
    bots.forEach(b=>{ if(aabb(b,box)){ b.vx=Math.sign(b.x-hx)*6; b.vy=-5; b.hitStun=14; b.wobble=0.8; }});
  });
  balls.forEach(b=>{
    b.x+=b.vx; b.rot+=b.vx*0.09; b.vy+=WORLD.gravity*0.55; b.y+=b.vy;
    if(b.y+b.r*2 >= WORLD.groundY){ b.y=WORLD.groundY-b.r*2; b.vy*=-0.42; if(Math.abs(b.vy)<1) b.vy=0; b.vx*=0.998; }
    if(b.x<580) { b.x=580; b.vx*=-1; }
    if(b.x>3600) { b.x=3600; b.vx*=-1; }
    const cx=b.x+b.r, cy=b.y+b.r, px=player.x+player.w/2, py=player.y+player.h/2, dx=px-cx, dy=py-cy, dist=Math.hypot(dx,dy), minD=b.r+Math.min(player.w,player.h)/2-2;
    if(dist<minD){ const nx=dx/(dist||1), ny=dy/(dist||1); player.vx=nx*6+b.vx*0.6; player.vy=ny*5-4; player.hitStun=14; shake=8; SFX.hit(); spawnPuff(px,py,8,b.type==='rasengan'?'#6bb8ff':'#ff6b2a'); }
    bots.forEach(bot=>{ const bx=bot.x+bot.w/2, by=bot.y+bot.h/2, ddx=bx-cx, ddy=by-cy, dd=Math.hypot(ddx,ddy); if(dd<b.r+16){ bot.vx=(ddx/(dd||1))*5; bot.vy=-4; bot.hitStun=10; }});
  });
  coins.forEach(c=>{
    if(c.taken) return; c.phase+=0.14; c.y+=Math.sin(c.phase)*0.18;
    if(aabb(player,{x:c.x-4,y:c.y-4,w:c.w+8,h:c.h+8})){ c.taken=true; ramenCollected++; SFX.ramen(); spawnPuff(c.x+9,c.y+9,8,'#ff6b2a'); if(ramenCollected>=7) SFX.win(); }
  });
  if(player.y>H+120){ player.x=Math.max(20,player.x-120); player.y=WORLD.groundY-80; player.vx=0; player.vy=0; player.hitStun=20; shake=6; SFX.hit(); }
  if(player.diving){ player.diveTime--; if(player.diveTime<=0||player.onGround) player.diving=false; }
  if(player.hitStun>0) player.hitStun--;
  player.wobble*=0.88; player.squish*=0.86; if(Math.abs(player.squish)<0.01) player.squish=0;

    const ahead=b.x+42; let need=false;

    hammers.forEach(h=>{ const hx=h.x+Math.sin(h.angle)*h.len; if(Math.abs(hx-b.x)<60) need=true; });
    balls.forEach(ball=>{ if(Math.abs(ball.x-b.x)<90) need=true; });
    trampolines.forEach(t=>{ if(Math.abs(t.x-b.x)<40) need=true; });
    if(need&&b.onGround&&Math.random()<0.08){ b.vy=-11; b.onGround=false; b.wobble=0.4; }
    b.x+=b.vx; b.y+=b.vy; b.onGround=false;
    if(b.y+b.h>=WORLD.groundY){ b.y=WORLD.groundY-b.h; b.vy=0; b.onGround=true; }

  });
  if(player.x+player.w >= finishX) finishGame();
  const targetCamX=clamp(player.x-W*0.42,0,WORLD.width-W);
  camX=lerp(camX,targetCamX,0.11); camY=lerp(camY,0,0.1); if(shake>0) shake*=0.82;
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.14; p.life-=p.decay; if(p.life<=0) particles.splice(i,1); }

function formatTime(s){ const m=Math.floor(s/60).toString().padStart(2,'0'); const sec=Math.floor(s%60).toString().padStart(2,'0'); const ms=Math.floor((s%1)*100).toString().padStart(2,'0'); return `${m}:${sec}.${ms}`; }

  if(player.power>0.2){
    ctx.strokeStyle=`rgba(255,107,42,${0.18+player.power*0.32})`; ctx.lineWidth=2+player.power*7; ctx.beginPath(); ctx.arc(player.x+player.w/2, player.y+player.h/2, 26+player.power*13, 0, Math.PI*2); ctx.stroke();
    if(player.power>0.7){ ctx.fillStyle='rgba(255,215,0,0.22)'; ctx.beginPath(); ctx.arc(player.x+player.w/2, player.y+player.h/2-22, 10,0,Math.PI*2); ctx.fill(); }
  }
  particles.forEach(p=>{ ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1;
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(0,0,W,8);
  ctx.restore();
}
function drawHokageMountain(){
  // 火影岩 - 四代目
  ctx.fillStyle='#c97a2a'; ctx.globalAlpha=0.92;
  ctx.beginPath(); ctx.moveTo(-180, 146);
  for(let x=-180;x<W+380;x+=110){ const h=34+Math.sin(x*0.01)*10; ctx.lineTo(x,146-h); }
  ctx.lineTo(W+380, 200); ctx.lineTo(-180,200); ctx.closePath(); ctx.fill();
  // 火影臉
  ctx.globalAlpha=1;
  ctx.fillStyle='#8b4513';
  for(let i=0;i<4;i++){
    const x= 80 + i*210;
    ctx.beginPath(); ctx.ellipse(x, 98, 36, 26,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e8b98a'; ctx.beginPath(); ctx.ellipse(x, 100, 28, 18,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a1940'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText(['初','二','三','四'][i], x, 104);
    ctx.fillStyle='#8b4513';
  }
  // 木葉大門鳥居
  ctx.fillStyle='#c41e00'; ctx.fillRect(W-260, 72, 44, 34); ctx.fillStyle='#0a1940'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('木葉', W-238, 92);
}
function drawCloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.beginPath();
  ctx.ellipse(x,y,s*0.42,s*0.32,0,0,Math.PI*2);
  ctx.ellipse(x+s*0.28,y-8,s*0.32,s*0.36,0,0,Math.PI*2);
  ctx.ellipse(x-s*0.26,y-4,s*0.30,s*0.26,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,107,42,0.12)'; ctx.beginPath(); ctx.ellipse(x,y+10,s*0.48,10,0,0,Math.PI*2); ctx.fill();
}
function drawRoof(x,y,w,h,squish=0){
  ctx.save(); ctx.translate(x+w/2, y+h/2); ctx.scale(1+squish*0.1, 1-squish*0.14); ctx.translate(-w/2,-h/2);
  // 木質屋頂
  ctx.fillStyle='#8b4513'; roundRect(0,0,w,h,6); ctx.fill();
  ctx.fillStyle='#a0522d'; roundRect(2,2,w-4,6,4); ctx.fill();
  ctx.strokeStyle='rgba(255,215,0,0.22)'; ctx.lineWidth=1.2; roundRect(0,0,w,h,6); ctx.stroke();
  // 瓦片線
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1; for(let i=14;i<w-6;i+=18){ ctx.beginPath(); ctx.moveTo(i,4); ctx.lineTo(i, h-4); ctx.stroke(); }
  // 木葉標誌
  ctx.fillStyle='rgba(255,215,0,0.9)'; ctx.font='bold 7px sans-serif'; ctx.textAlign='center'; ctx.fillText('木', w/2, h/2+2);
  ctx.restore();
  ctx.fillStyle='rgba(139,69,19,0.18)'; ctx.beginPath(); ctx.ellipse(x+w/2, WORLD.groundY+3, w*0.42, 3.2,0,0,Math.PI*2); ctx.fill();
}
function drawShuriken(x,y,r){
  ctx.save(); ctx.translate(x,y);
  for(let i=0;i<4;i++){
    ctx.rotate(Math.PI/2);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r*0.35, r*0.18); ctx.lineTo(r,0); ctx.lineTo(r*0.35, -r*0.18); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle='#0a1940'; ctx.beginPath(); ctx.arc(0,0,r*0.22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(0,0,r*0.1,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawFinish(){
  const fx=finishX;
  // 火影門 - 鳥居
  ctx.fillStyle='#c41e00'; roundRect(fx-18, WORLD.groundY-150, 30,150,6); ctx.fill();
  ctx.fillStyle='#0a1940'; roundRect(fx+16, WORLD.groundY-150, 30,150,6); ctx.fill();
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; roundRect(fx-18, WORLD.groundY-150, 30,150,6); ctx.stroke(); roundRect(fx+16, WORLD.groundY-150, 30,150,6); ctx.stroke();
  ctx.fillStyle='#0a1940'; roundRect(fx-40, WORLD.groundY-162, 112, 26, 10); ctx.fill(); ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.font='900 13px sans-serif'; ctx.textAlign='center'; ctx.fillText('火影', fx+13, WORLD.groundY-145);
  ctx.fillStyle='#fff'; ctx.font='bold 7px sans-serif'; ctx.fillText('GOAL', fx+13, WORLD.groundY-135);
  // 歷代火影帽
  ctx.save(); ctx.translate(fx+13, WORLD.groundY-184); const bob=Math.sin(frame*0.06)*3; ctx.translate(0,bob);
  ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.ellipse(0,0,28,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,-6,20,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#0a1940'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText('火',0,-1);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.ellipse(0,0,28,10,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(10,25,64,0.12)'; ctx.fillRect(fx-64, WORLD.groundY, 128, 3);
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?'#ffd700':'#c41e00'; ctx.fillRect(fx-44+i*11, WORLD.groundY-12,11,12); }
}
function drawEgg(x,y,w,h,skin,dir,wobble,hitStun,squish=0,diving=false){
  const isNine=skin.name==='九尾';
  ctx.save(); ctx.translate(x+w/2, y+h/2);
  const wob=Math.sin(frame*0.3+x*0.01)*wobble*0.08;
  const hit=hitStun>0?Math.sin(frame*0.9)*0.12:0;
  const sx=1+(squish||0)+wob+hit, sy=1-(squish||0)*0.7 -wob*0.5+hit*0.5;
  const rot=diving?dir*0.9:(wobble*0.08*dir)+(hitStun?Math.sin(frame*0.5)*0.12:0);
  ctx.rotate(rot); ctx.scale(sx,sy);
  if(isNine){ ctx.shadowColor='#ff6b2a'; ctx.shadowBlur=16; }
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0,h/2+8,w*0.45,5,0,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  const r=w/2; ctx.fillStyle=skin.body; roundRect(-w/2,-h/2,w,h,r); ctx.fill();
  ctx.fillStyle=skin.belly; ctx.beginPath(); ctx.ellipse(0,6,w*0.34,h*0.28,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c41e00'; ctx.font='bold 8px sans-serif'; ctx.textAlign='center'; ctx.fillText(skin.emblem||'忍',0,10);
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(-w*0.22,-h*0.28,5,9,-0.3,0,Math.PI*2); ctx.fill();
  // 髮
  if(isNine){ ctx.fillStyle='#ff4500'; ctx.beginPath(); ctx.moveTo(-w*0.44,-h*0.28); ctx.lineTo(-w*0.3,-h*0.64); ctx.lineTo(-w*0.08,-h*0.52); ctx.lineTo(0,-h*0.70); ctx.lineTo(w*0.08,-h*0.52); ctx.lineTo(w*0.30,-h*0.64); ctx.lineTo(w*0.44,-h*0.28); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.ellipse(0,-h*0.42, w*0.18, 4,0,0,Math.PI*2); ctx.fill(); }
  else { ctx.fillStyle=skin.hair; ctx.beginPath(); ctx.moveTo(-w*0.38,-h*0.26); ctx.lineTo(-w*0.22,-h*0.58); ctx.lineTo(-w*0.06,-h*0.46); ctx.lineTo(0,-h*0.60); ctx.lineTo(w*0.06,-h*0.46); ctx.lineTo(w*0.22,-h*0.58); ctx.lineTo(w*0.38,-h*0.26); ctx.closePath(); ctx.fill(); }
  // 護額
  ctx.fillStyle='#0a1940'; ctx.fillRect(-w*0.32, -h*0.32, w*0.64, 7);
  ctx.fillStyle='#c0c0c0'; ctx.fillRect(-w*0.28, -h*0.32, w*0.56, 7);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1; ctx.strokeRect(-w*0.28, -h*0.32, w*0.56, 7);
  ctx.fillStyle='#0a1940'; ctx.font='bold 7px sans-serif'; ctx.textAlign='center'; ctx.fillText('木葉',0, -h*0.32+5);
  // 漩渦臉紋 - 鳴人
  if(skin.name==='鳴人'){ ctx.strokeStyle='#c41e00'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-w*0.14,0); ctx.lineTo(-w*0.08,0); ctx.moveTo(w*0.08,0); ctx.lineTo(w*0.14,0); ctx.stroke(); ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.arc(-w*0.11,0,1,0,Math.PI*2); ctx.arc(w*0.11,0,1,0,Math.PI*2); ctx.fill(); }
  const eyeY=-5, eyeDx=7;
  if(diving){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,4,7,4,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.arc(0,5,1.8,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0a1940'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-eyeDx-2, eyeY-1); ctx.lineTo(-eyeDx+2, eyeY+1); ctx.moveTo(eyeDx-2, eyeY+1); ctx.lineTo(eyeDx+2, eyeY-1); ctx.stroke();
  } else if(hitStun>0){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-eyeDx,eyeY,3.4,0,Math.PI*2); ctx.arc(eyeDx,eyeY,3.4,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.arc(-eyeDx,eyeY,1.6,0,Math.PI*2); ctx.arc(eyeDx,eyeY,1.6,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-eyeDx,eyeY,3.6,0,Math.PI*2); ctx.arc(eyeDx,eyeY,3.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a1940'; ctx.beginPath(); ctx.arc(-eyeDx,eyeY,1.8,0,Math.PI*2); ctx.arc(eyeDx,eyeY,1.8,0,Math.PI*2); ctx.fill(); 
    // 寫輪眼 - 佐助
    if(skin.name==='佐助'){ ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.arc(eyeDx,eyeY,1.8,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(eyeDx,eyeY,0.6,0,Math.PI*2); ctx.fill(); }
    else { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-eyeDx+1,eyeY-1,1.1,0,Math.PI*2); ctx.arc(eyeDx+1,eyeY-1,1.1,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle='#c41e00'; ctx.beginPath(); ctx.ellipse(0,6,3,1.6,0,0,Math.PI*2); ctx.fill();
  }
  const swing=Math.sin(frame*0.22+x*0.02)*(hitStun?0:1);
  ctx.fillStyle=skin.body; ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.ellipse(-w/2-3+swing*1.2,-2,5,7,-0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(w/2+3-swing*1.2,-2,5,7,0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#0a1940'; ctx.beginPath(); ctx.ellipse(-w*0.22,h/2+2,7,4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(w*0.22,h/2+2,7,4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff6b2a'; ctx.fillRect(-w*0.22-2,h/2+1,4,1); ctx.fillRect(w*0.22-2,h/2+1,4,1);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function starPath(x,y,R,r,n){ ctx.beginPath(); for(let i=0;i<n*2;i++){ const rad=(i*Math.PI/n)-Math.PI/2; const rad2=i%2?r:R; ctx.lineTo(x+Math.cos(rad)*rad2, y+Math.sin(rad)*rad2);} ctx.closePath(); }
function startGame(){ gameState='playing'; time=0; frame=0; camX=0; camY=0; shake=0; ramenCollected=0; resetPlayer(); buildLevel(); startOverlay.style.opacity='0'; startOverlay.style.pointerEvents='none'; startOverlay.style.display='none'; endOverlay.classList.remove('show'); aEnsure(); }
function finishGame(){ if(gameState==='finished') return; gameState='finished'; const all=[player,...bots].sort((a,b)=>b.x-a.x); const rank=all.indexOf(player)+1; const tStr=formatTime(time); document.getElementById('endIcon').textContent=rank===1?'🍥': rank<=2?'🥈':'😢'; document.getElementById('endTitle').textContent=rank===1?'成為火影！': rank===2?'就差一點！':'再修行！'; document.getElementById('endDesc').textContent=`用時 ${tStr} · 排名 ${rank} / ${all.length} · 拉麵 ${ramenCollected}/7`; endOverlay.classList.add('show'); if(rank===1) SFX.win(); else SFX.hit(); for(let i=0;i<18;i++) spawnPuff(player.x+rand(-20,20),player.y+rand(-20,10),1,['#ff6b2a','#ffd700','#6bb8ff'][i%3]); }
function restart(){ startGame(); }
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', restart);
document.getElementById('shareBtn').addEventListener('click', ()=>{ const data=cvs.toDataURL('image/png'); const w=window.open(); w.document.write('<img src="'+data+'" style="width:100%">'); });
window.addEventListener('keydown',e=>{ if(e.code==='Enter'&&gameState==='start') startGame(); });
buildLevel(); resetPlayer();
function loop(){ update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
