<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON RONIN — 橫向捲軸動作遊戲</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#070a14;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block}
.blink{animation:bk 1.1s steps(2,end) infinite}
@keyframes bk{50%{opacity:.12}}
</style>
</head>
<body>
<svg id="game" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d1330"/><stop offset=".55" stop-color="#2a1a52"/><stop offset="1" stop-color="#71286b"/>
</linearGradient>
<radialGradient id="sunGrad" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#ffe95c"/><stop offset=".65" stop-color="#ff9e3d"/><stop offset="1" stop-color="#ff3d81"/>
</radialGradient>
<linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#273061"/><stop offset="1" stop-color="#11162e"/>
</linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".72">
<stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
</radialGradient>
</defs>

<g id="sky"></g>
<g id="layerFar"></g>
<g id="layerMid"></g>
<g id="world">
<g id="gPlat"></g>
<g id="gItems"></g>
<g id="gEnemies"></g>
<g id="gBullets"></g>
<g id="gBoss"></g>
<g id="gPlayer"></g>
<g id="gFx"></g>
</g>
<rect x="0" y="0" width="960" height="540" fill="url(#vig)" pointer-events="none"/>

<g id="hud" pointer-events="none" font-family="Consolas,monospace">
<text x="24" y="34" font-size="13" fill="#9fb4ff">HP</text>
<rect x="50" y="22" width="210" height="16" rx="4" fill="#0b1024" stroke="#3fe0ff" stroke-width="1.5"/>
<rect id="hudHp" x="52" y="24" width="206" height="12" rx="3" fill="#3dff8f"/>
<text x="24" y="58" font-size="11" fill="#9fb4ff">PWR</text>
<rect id="pip0" x="56" y="49" width="18" height="9" fill="#20304f"/>
<rect id="pip1" x="78" y="49" width="18" height="9" fill="#20304f"/>
<rect id="pip2" x="100" y="49" width="18" height="9" fill="#20304f"/>
<text id="hudScore" x="936" y="34" font-size="18" fill="#ffd23f" text-anchor="end">SCORE 000000</text>
<rect x="70" y="520" width="320" height="7" rx="3" fill="#0b1024" stroke="#57628f" stroke-width="1"/>
<rect id="progFill" x="71" y="521" width="0" height="5" fill="#3fe0ff"/>
<polygon id="progMark" points="0,517 -5,508 5,508" fill="#ffd23f"/>
<text x="396" y="530" font-size="10" fill="#7f8ec4" text-anchor="end">GOAL</text>
<g id="bossBar" visibility="hidden">
<text x="480" y="52" font-size="13" fill="#ff7ba9" text-anchor="middle">守衛者 MK-II</text>
<rect x="260" y="58" width="440" height="14" rx="4" fill="#0b1024" stroke="#ff2e88" stroke-width="1.5"/>
<rect id="bossHp" x="262" y="60" width="436" height="10" rx="3" fill="#ff2e88"/>
</g>
</g>

<g id="ovMenu" font-family="Consolas,monospace" text-anchor="middle">
<rect x="0" y="0" width="960" height="540" fill="#05060f" opacity=".82"/>
<text x="482" y="188" font-size="64" fill="#ff2e88" opacity=".85" letter-spacing="6">NEON RONIN</text>
<text x="480" y="182" font-size="64" fill="#3fe0ff" letter-spacing="6">NEON RONIN</text>
<text x="480" y="222" font-size="17" fill="#cdd8ff">橫向捲軸動作遊戲 — 抵達終點並擊敗守衛者</text>
<text x="480" y="292" font-size="15" fill="#9fb4ff">← → 移動&#160;&#160;&#160;SPACE 跳躍／二段跳&#160;&#160;&#160;Z 或 J 攻擊</text>
<text x="480" y="318" font-size="15" fill="#9fb4ff">SHIFT 衝刺（無敵帧）&#160;&#160;&#160;P 暫停</text>
<g id="btnStart" style="cursor:pointer">
<rect x="360" y="360" width="240" height="54" rx="10" fill="#121a3e" stroke="#3fe0ff" stroke-width="2"/>
<text x="480" y="394" font-size="20" fill="#3fe0ff">開始 START</text>
</g>
<text x="480" y="452" font-size="13" fill="#7f8ec4" class="blink">按 ENTER 或點擊按鈕開始</text>
</g>

<g id="ovPause" visibility="hidden" font-family="Consolas,monospace" text-anchor="middle">
<rect x="0" y="0" width="960" height="540" fill="#05060f" opacity=".6"/>
<text x="480" y="266" font-size="42" fill="#ffd23f">暫停 PAUSED</text>
<text x="480" y="304" font-size="15" fill="#9fb4ff">按 P 繼續遊戲</text>
</g>

<g id="ovOver" visibility="hidden" font-family="Consolas,monospace" text-anchor="middle">
<rect x="0" y="0" width="960" height="540" fill="#160510" opacity=".84"/>
<text x="480" y="238" font-size="48" fill="#ff4b5c">任務失敗</text>
<text x="480" y="284" font-size="20" fill="#ffb1b1">GAME OVER</text>
<text id="overScore" x="480" y="330" font-size="17" fill="#ffd23f">SCORE 0</text>
<g id="btnRetry1" style="cursor:pointer">
<rect x="370" y="360" width="220" height="50" rx="10" fill="#121a3e" stroke="#ff4b5c" stroke-width="2"/>
<text x="480" y="392" font-size="18" fill="#ffb1b1">重新挑戰 RETRY</text>
</g>
</g>

<g id="ovWin" visibility="hidden" font-family="Consolas,monospace" text-anchor="middle">
<rect x="0" y="0" width="960" height="540" fill="#04121c" opacity=".84"/>
<text x="480" y="232" font-size="50" fill="#3dff8f">任務完成！</text>
<text x="480" y="278" font-size="20" fill="#b1ffd0">VICTORY — 守衛者已摧毀</text>
<text id="winScore" x="480" y="326" font-size="17" fill="#ffd23f">SCORE 0</text>
<g id="btnRetry2" style="cursor:pointer">
<rect x="370" y="360" width="220" height="50" rx="10" fill="#121a3e" stroke="#3fe0ff" stroke-width="2"/>
<text x="480" y="392" font-size="18" fill="#9fdfff">再玩一次 AGAIN</text>
</g>
</g>
</svg>

    <script src="game.js"></script>
</body>
</html>
