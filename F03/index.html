    this.moveTo(x + r, y);

    this.arcTo(x + w, y + h, x, y + h, r);

<!-- ===== EventBus ===== -->
<script>
// Central event bus for cross-module communication
const EventBus = {
  _listeners: {},

  on(event, callback) {
    if (!this._listeners[event]) this._listeners[event] = [];
    this._listeners[event].push(callback);
  },

  off(event, callback) {
    if (!this._listeners[event]) return;
    this._listeners[event] = this._listeners[event].filter(cb => cb !== callback);
  },

  emit(event, data) {
    if (!this._listeners[event]) return;
    for (const cb of this._listeners[event]) {
      try { cb(data); } catch (e) { console.error(`EventBus error in ${event}:`, e); }
    }
  }
};
</script>

<!-- ===== MobileSystem ===== -->
<script>
// utils/mobileSystem.js - Canvas responsive adaptation
const MobileSystem = {
  canvas: null,
  ctx: null,
  cssWidth: 0,
  cssHeight: 0,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    const dpr = window.devicePixelRatio || 1;
    const windowW = window.innerWidth;
    const windowH = window.innerHeight;

    let cssW, cssH;
    if (windowW / windowH > CONFIG.CANVAS_ASPECT) {
      cssH = windowH;
      cssW = cssH * CONFIG.CANVAS_ASPECT;
    } else {
      cssW = windowW;
      cssH = cssW / CONFIG.CANVAS_ASPECT;
    }

    this.cssWidth = cssW;
    this.cssHeight = cssH;

    this.canvas.style.width = cssW + 'px';
    this.canvas.style.height = cssH + 'px';
    this.canvas.width = Math.floor(cssW * dpr);
    this.canvas.height = Math.floor(cssH * dpr);

    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  getScale() {
    return this.cssWidth / CONFIG.LOGICAL_WIDTH;
  },

  clear() {
    this.ctx.clearRect(0, 0, this.cssWidth, this.cssHeight);
  }
};
</script>

<script>
// view/backgroundSystem.js - Parallax scrolling background
const BackgroundSystem = {
  stars: [],
  speedLines: [],

  init() {
    this.stars = [];
    for (let i = 0; i < 120; i++) {
      this.stars.push({
        x: Math.random() * CONFIG.LOGICAL_WIDTH,
        y: Math.random() * CONFIG.LOGICAL_HEIGHT,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 60 + 20,
        brightness: Math.random() * 0.5 + 0.5
      });
    }
    this.speedLines = [];
    for (let i = 0; i < 15; i++) {
      this.speedLines.push({
        x: Math.random() * CONFIG.LOGICAL_WIDTH,
        y: Math.random() * CONFIG.LOGICAL_HEIGHT,
        length: Math.random() * 40 + 20,
        speed: Math.random() * 200 + 150,
        alpha: Math.random() * 0.15 + 0.05
      });
    }
  },

  update(dt) {
    for (const star of this.stars) {
      star.y += star.speed * dt;
      if (star.y > CONFIG.LOGICAL_HEIGHT) {
        star.y = -5;
        star.x = Math.random() * CONFIG.LOGICAL_WIDTH;
      }
    }
    for (const line of this.speedLines) {
      line.y += line.speed * dt;
      if (line.y > CONFIG.LOGICAL_HEIGHT + line.length) {
        line.y = -line.length;
        line.x = Math.random() * CONFIG.LOGICAL_WIDTH;
      }
    }
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    ctx.save();
    ctx.scale(scale, scale);

    // Speed lines
    for (const line of this.speedLines) {
      ctx.strokeStyle = `rgba(100, 180, 255, ${line.alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(line.x, line.y);
      ctx.lineTo(line.x, line.y + line.length);
      ctx.stroke();
    }

    // Stars
    for (const star of this.stars) {
      ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
};
</script>

<script>
// view/cameraSystem.js - Camera transform for canvas
const CameraSystem = {
  offsetX: 0,
  offsetY: 0,
  shakeIntensity: 0,
  shakeDuration: 0,
  shakeTimer: 0,

  init() { /* no-op */ },

  update(dt) {
    if (this.shakeDuration > 0) {
      this.shakeTimer -= dt;
      if (this.shakeTimer <= 0) {
        this.shakeIntensity = 0;
        this.shakeDuration = 0;
      } else {
        this.offsetX = (Math.random() - 0.5) * this.shakeIntensity * 2;
        this.offsetY = (Math.random() - 0.5) * this.shakeIntensity * 2;
      }
    } else {
      this.offsetX = 0;
      this.offsetY = 0;
    }
  },

  shake(intensity, duration) {
    this.shakeIntensity = intensity;
    this.shakeDuration = duration;
    this.shakeTimer = duration;
  },

  apply(ctx) {
    const scale = MobileSystem.getScale();
    ctx.save();
    ctx.translate(this.offsetX * scale, this.offsetY * scale);
    ctx.scale(scale, scale);
  },

  restore(ctx) {
    ctx.restore();
  }
};
</script>

<script>
// player/inputSystem.js - Touch/mouse/keyboard input handling
const InputSystem = {
  keys: {},
  touchActive: false,
  touchX: 0,
  touchY: 0,
  touchStartX: 0,
  touchStartY: 0,
  mouseActive: false,
  mouseX: 0,
  mouseY: 0,
  clickFired: false,
  movedDist: 0,
  lastWasDrag: false,
  DRAG_THRESHOLD: 15,

  init() {
    // Keyboard
    window.addEventListener('keydown', (e) => {
      this.keys[e.code] = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
          e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

    // Touch
    const canvas = MobileSystem.canvas;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      this.touchActive = true;
      this.touchX = (t.clientX - rect.left) / MobileSystem.getScale();
      this.touchY = (t.clientY - rect.top) / MobileSystem.getScale();
      this.touchStartX = this.touchX;
      this.touchStartY = this.touchY;
      this.movedDist = 0;
      this.clickFired = true;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const nx = (t.clientX - rect.left) / MobileSystem.getScale();
      const ny = (t.clientY - rect.top) / MobileSystem.getScale();
      this.movedDist += Math.hypot(nx - this.touchX, ny - this.touchY);
      this.touchX = nx;
      this.touchY = ny;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      this.lastWasDrag = this.movedDist > this.DRAG_THRESHOLD;
      this.touchActive = false;
    }, { passive: false });

    // Mouse
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      this.mouseActive = true;
      this.mouseX = (e.clientX - rect.left) / MobileSystem.getScale();
      this.mouseY = (e.clientY - rect.top) / MobileSystem.getScale();
      this.touchStartX = this.mouseX;
      this.touchStartY = this.mouseY;
      this.movedDist = 0;
      this.clickFired = true;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!this.mouseActive) return;
      const rect = canvas.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / MobileSystem.getScale();
      const ny = (e.clientY - rect.top) / MobileSystem.getScale();
      this.movedDist += Math.hypot(nx - this.mouseX, ny - this.mouseY);
      this.mouseX = nx;
      this.mouseY = ny;
    });

    canvas.addEventListener('mouseup', () => {
      this.lastWasDrag = this.movedDist > this.DRAG_THRESHOLD;
      this.mouseActive = false;
    });
    canvas.addEventListener('mouseleave', () => { this.mouseActive = false; });
  },

  update(dt) {
    // consumed each frame
  },

  isMoveInputActive() {
    return this.touchActive || this.mouseActive ||
      this.keys['ArrowUp'] || this.keys['ArrowDown'] ||
      this.keys['ArrowLeft'] || this.keys['ArrowRight'] ||
      this.keys['KeyW'] || this.keys['KeyS'] ||
      this.keys['KeyA'] || this.keys['KeyD'];
  },

  getMoveDelta() {
    let dx = 0, dy = 0;

    if (this.touchActive) {
      dx = this.touchX - this.touchStartX;
      dy = this.touchY - this.touchStartY;
    } else if (this.mouseActive) {
      dx = this.mouseX - this.touchStartX;
      dy = this.mouseY - this.touchStartY;
    } else {
      const speed = CONFIG.PLAYER_SPEED * 0.016;
      if (this.keys['ArrowLeft'] || this.keys['KeyA']) dx -= speed;
      if (this.keys['ArrowRight'] || this.keys['KeyD']) dx += speed;
      if (this.keys['ArrowUp'] || this.keys['KeyW']) dy -= speed;
      if (this.keys['ArrowDown'] || this.keys['KeyS']) dy += speed;
    }

    return { dx, dy };
  },

  getTouchPos() {
    if (this.touchActive) return { x: this.touchX, y: this.touchY };
    if (this.mouseActive) return { x: this.mouseX, y: this.mouseY };
    return null;
  },

  consumeClick() {
    const fired = this.clickFired;
    this.clickFired = false;
    return fired;
  },

  wasLastDrag() {
    return this.lastWasDrag;
  }
};
</script>

<script>
// player/playerSystem.js - Player entity management
const PlayerSystem = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0,
  hp: CONFIG.PLAYER_HP,
  maxHp: CONFIG.PLAYER_HP,
  width: CONFIG.PLAYER_WIDTH,
  height: CONFIG.PLAYER_HEIGHT,
  get w() { return this.width; },
  get h() { return this.height; },
  active: true,
  invincibleTimer: 0,
  shootCooldown: 0,
  shieldActive: false,
  shieldTimer: 0,
  powerLevel: 1,
  rapidTimer: 0,
  spreadTimer: 0,
  missileTimer: 0,
  laserTimer: 0,
  missileCooldown: 0,
  laserCooldown: 0,
  missileWeaponActive: true,
  laserWeaponActive: true,
  shipType: 'LASER',
  weaponLevel: 1,
  companions: [],

  init() {
    this.reset();
  },

  reset() {
    this.x = CONFIG.LOGICAL_WIDTH / 2;
    this.y = CONFIG.LOGICAL_HEIGHT - 100;
    this.vx = 0;
    this.vy = 0;
    this.hp = CONFIG.PLAYER_HP;
    this.maxHp = CONFIG.PLAYER_HP;
    this.active = true;
    this.invincibleTimer = 0;
    this.shootCooldown = 0;
    this.shieldActive = false;
    this.shieldTimer = 0;
    this.powerLevel = 1;
    this.rapidTimer = 0;
    this.spreadTimer = 0;
    this.missileTimer = 0;
    this.laserTimer = 0;
    this.missileCooldown = 0;
    this.laserCooldown = 0;
    this.missileWeaponActive = true;
    this.laserWeaponActive = true;
    this.shipType = selectedShipType;
    this.weaponLevel = 1;
    this.companions = [];
    
    // Initialize companions for COMPANION ship type
    if (this.shipType === 'COMPANION') {
      for (let i = 0; i < 1; i++) {
        this.companions.push({
          x: this.x - 30,
          y: this.y + 20,
          angle: 0,
          active: true
        });
      }
    }
  },

  update(dt) {
    if (!this.active) return;

    // Timers
    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
    if (this.shootCooldown > 0) this.shootCooldown -= dt;
    if (this.shieldTimer > 0) {
      this.shieldTimer -= dt;
      if (this.shieldTimer <= 0) this.shieldActive = false;
    }
    if (this.rapidTimer > 0) this.rapidTimer -= dt;
    if (this.spreadTimer > 0) this.spreadTimer -= dt;
    if (this.missileTimer > 0) this.missileTimer -= dt;
    if (this.laserTimer > 0) this.laserTimer -= dt;
    if (this.missileCooldown > 0) this.missileCooldown -= dt;
    if (this.laserCooldown > 0) this.laserCooldown -= dt;

    // Movement from input
    if (InputSystem.isMoveInputActive()) {
      const pos = InputSystem.getTouchPos();
      if (pos) {
        // Direct position mapping (touch/mouse)
        const targetX = pos.x;
        const targetY = pos.y - 40; // offset so finger doesn't cover player
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2) {
          const speed = Math.min(CONFIG.PLAYER_SPEED * dt, dist);
          this.vx = (dx / dist) * speed / dt;
          this.vy = (dy / dist) * speed / dt;
        } else {
          this.vx = 0;
          this.vy = 0;
        }
      } else {
        // Keyboard
        let kdx = 0, kdy = 0;
        if (InputSystem.keys['ArrowLeft'] || InputSystem.keys['KeyA']) kdx -= 1;
        if (InputSystem.keys['ArrowRight'] || InputSystem.keys['KeyD']) kdx += 1;
        if (InputSystem.keys['ArrowUp'] || InputSystem.keys['KeyW']) kdy -= 1;
        if (InputSystem.keys['ArrowDown'] || InputSystem.keys['KeyS']) kdy += 1;
        if (kdx !== 0 || kdy !== 0) {
          const len = Math.sqrt(kdx * kdx + kdy * kdy);
          this.vx = (kdx / len) * CONFIG.PLAYER_SPEED;
          this.vy = (kdy / len) * CONFIG.PLAYER_SPEED;
        } else {
          this.vx = 0;
          this.vy = 0;
        }
      }
    } else {
      this.vx = 0;
      this.vy = 0;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Boundary clamp
    const halfW = this.width / 2;
    const halfH = this.height / 2;
    this.x = Math.max(halfW, Math.min(CONFIG.LOGICAL_WIDTH - halfW, this.x));
    this.y = Math.max(halfH, Math.min(CONFIG.LOGICAL_HEIGHT - halfH, this.y));
  },

  takeDamage(damage) {
    if (this.invincibleTimer > 0 || !this.active) return false;
    if (this.shieldActive) {
      this.shieldActive = false;
      this.shieldTimer = 0;
      EventBus.emit('playerShieldBroken', {});
      return false;
    }
    this.hp -= damage;
    this.invincibleTimer = CONFIG.PLAYER_INVINCIBLE_DURATION;
    CameraSystem.shake(5, 0.3);
    EventBus.emit('playerHit', { x: this.x, y: this.y });
    if (this.hp <= 0) {
      this.hp = 0;
      this.active = false;
      EventBus.emit('playerDied', { x: this.x, y: this.y });
    }
    return true;
  },

  heal(amount) {
    this.hp = Math.min(this.maxHp, this.hp + amount);
  },

  applyPowerUp(type) {
    const dur = CONFIG.POWERUP_DURATION;
    switch (type) {
      case 'POWER':
        this.powerLevel = Math.min(3, this.powerLevel + 1);
        // Also upgrade ship weapon level
        if (this.weaponLevel < 3) {
          this.weaponLevel++;
          // Update companions for COMPANION ship type
          if (this.shipType === 'COMPANION' && this.companions.length < this.weaponLevel) {
            for (let i = this.companions.length; i < this.weaponLevel; i++) {
              this.companions.push({
                x: this.x - 30,
                y: this.y + 20,
                angle: 0,
                active: true
              });
            }
          }
        }
        break;
      case 'RAPID':
        this.rapidTimer = dur;
        break;
      case 'SPREAD':
        this.spreadTimer = dur;
        break;
      case 'SHIELD':
        this.shieldActive = true;
        this.shieldTimer = dur;
        break;
      case 'HEALTH':
        this.heal(3);
        break;
      case 'MISSILE':
        this.missileTimer = dur;
        break;
      case 'LASER':
        this.laserTimer = dur;
        break;
    }
    EventBus.emit('playerPowerUp', { type, x: this.x, y: this.y });
  },

  getShootCooldown() {
    return this.rapidTimer > 0 ? CONFIG.PLAYER_SHOOT_COOLDOWN * 0.5 : CONFIG.PLAYER_SHOOT_COOLDOWN;
  },

  isCanShoot() {
    return this.shootCooldown <= 0 && this.active;
  },

  onShoot() {
    this.shootCooldown = this.getShootCooldown();
  },

  render(ctx) {
    if (!this.active) return;

    // Blink when invincible
    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer * 10) % 2 === 0) return;

    const scale = MobileSystem.getScale();
    ctx.save();
    ctx.translate(this.x * scale, this.y * scale);
    ctx.scale(scale * CONFIG.SHIP_RENDER_SCALE, scale * CONFIG.SHIP_RENDER_SCALE);

    // Get ship color based on type
    const shipColor = SHIP_TYPES[this.shipType]?.color || CONFIG.COLORS.playerBody;
    const weaponColor = SHIP_TYPES[this.shipType]?.weaponColor || CONFIG.COLORS.playerWing;

    // Draw different ship based on type
    if (this.shipType === 'LASER') {
      // Laser ship - sleek, angular design
      ctx.fillStyle = shipColor;
      ctx.beginPath();
      ctx.moveTo(0, -this.height / 2);
      ctx.lineTo(-this.width / 2, this.height / 2);
      ctx.lineTo(this.width / 2, this.height / 2);
      ctx.closePath();
      ctx.fill();

      // Wings
      ctx.fillStyle = weaponColor;
      ctx.beginPath();
      ctx.moveTo(-this.width / 4, 0);
      ctx.lineTo(-this.width / 2 - 6, this.height / 3);
      ctx.lineTo(-this.width / 4, this.height / 4);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(this.width / 4, 0);
      ctx.lineTo(this.width / 2 + 6, this.height / 3);
      ctx.lineTo(this.width / 4, this.height / 4);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#e1f5fe';
      ctx.beginPath();
      ctx.arc(0, -4, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.shipType === 'MISSILE') {
      // Missile ship - heavy, armored design
      ctx.fillStyle = shipColor;
      ctx.beginPath();
      ctx.moveTo(0, -this.height / 2);
      ctx.lineTo(-this.width / 2 - 4, this.height / 3);
      ctx.lineTo(-this.width / 3, this.height / 2);
      ctx.lineTo(this.width / 3, this.height / 2);
      ctx.lineTo(this.width / 2 + 4, this.height / 3);
      ctx.closePath();
      ctx.fill();

      // Wings
      ctx.fillStyle = weaponColor;
      ctx.beginPath();
      ctx.moveTo(-this.width / 3, this.height / 4);
      ctx.lineTo(-this.width / 2 - 8, this.height / 2);
      ctx.lineTo(-this.width / 4, this.height / 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(this.width / 3, this.height / 4);
      ctx.lineTo(this.width / 2 + 8, this.height / 2);
      ctx.lineTo(this.width / 4, this.height / 2);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#c8e6c9';
      ctx.beginPath();
      ctx.arc(0, -4, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.shipType === 'COMPANION') {
      // Companion ship - smaller, with orbiting companions
      ctx.fillStyle = shipColor;
      ctx.beginPath();
      ctx.moveTo(0, -this.height / 2);
      ctx.lineTo(-this.width / 3, this.height / 2);
      ctx.lineTo(this.width / 3, this.height / 2);
      ctx.closePath();
      ctx.fill();

      // Wings
      ctx.fillStyle = weaponColor;
      ctx.beginPath();
      ctx.moveTo(-this.width / 6, 0);
      ctx.lineTo(-this.width / 3 - 4, this.height / 3);
      ctx.lineTo(-this.width / 6, this.height / 4);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(this.width / 6, 0);
      ctx.lineTo(this.width / 3 + 4, this.height / 3);
      ctx.lineTo(this.width / 6, this.height / 4);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#ffe0b2';
      ctx.beginPath();
      ctx.arc(0, -4, 4, 0, Math.PI * 2);
      ctx.fill();

      // Draw companions
      for (const comp of this.companions) {
        if (comp.active) {
          ctx.fillStyle = weaponColor;
          ctx.beginPath();
          ctx.arc((comp.x - this.x), (comp.y - this.y), 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc((comp.x - this.x), (comp.y - this.y), 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Shield visual
    if (this.shieldActive) {
      ctx.strokeStyle = `rgba(77, 208, 225, ${0.5 + Math.sin(Date.now() * 0.005) * 0.3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.width / 2 + 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }
};

<script>
// combat/bulletSystem.js - Player bullet management with object pooling
const BulletSystem = {
  pool: [],
  active: [],

  init() {
    this.pool = [];
    this.active = [];
    for (let i = 0; i < CONFIG.MAX_BULLETS; i++) {
      this.pool.push({ x: 0, y: 0, w: CONFIG.BULLET_WIDTH, h: CONFIG.BULLET_HEIGHT, vx: 0, vy: -CONFIG.BULLET_SPEED, hp: 1, active: false });
    }
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const b = this.active[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y < -b.h || b.y > CONFIG.LOGICAL_HEIGHT + b.h ||
          b.x < -b.w || b.x > CONFIG.LOGICAL_WIDTH + b.w) {
        b.active = false;
        this.pool.push(b);
        this.active.splice(i, 1);
      }
    }
  },

  shoot(x, y) {
    const level = PlayerSystem.powerLevel;
    const spread = PlayerSystem.spreadTimer > 0;
    const speed = -CONFIG.BULLET_SPEED;

    // Center bullet
    this._spawn(x, y - PlayerSystem.height / 2, 0, speed);

    if (level >= 2 || spread) {
      this._spawn(x - 12, y - PlayerSystem.height / 2 + 4, -30, speed);
      this._spawn(x + 12, y - PlayerSystem.height / 2 + 4, 30, speed);
    }
    if (level >= 3) {
      this._spawn(x - 20, y - PlayerSystem.height / 2 + 8, -80, speed * 0.95);
      this._spawn(x + 20, y - PlayerSystem.height / 2 + 8, 80, speed * 0.95);
    }
    if (spread && level >= 2) {
      this._spawn(x - 8, y - PlayerSystem.height / 2, -120, speed * 0.9);
      this._spawn(x + 8, y - PlayerSystem.height / 2, 120, speed * 0.9);
    }
  },

  _spawn(x, y, vx, vy) {
    let b;
    if (this.pool.length > 0) {
      b = this.pool.pop();
    } else if (this.active.length >= CONFIG.MAX_BULLETS) {
      return; // pool exhausted
    } else {
      b = { x: 0, y: 0, w: CONFIG.BULLET_WIDTH, h: CONFIG.BULLET_HEIGHT, vx: 0, vy: 0, hp: 1, active: false };
    }
    b.x = x;
    b.y = y;
    b.vx = vx;
    b.vy = vy;
    b.hp = CONFIG.BULLET_DAMAGE;
    b.active = true;
    this.active.push(b);
  },

  spawn(x, y, vx, vy) {
    this._spawn(x, y, vx, vy);
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    ctx.fillStyle = CONFIG.COLORS.playerBullet;
    for (const b of this.active) {
      if (!b.active) continue;
      ctx.save();
      ctx.translate(b.x * scale, b.y * scale);
      ctx.scale(CONFIG.BULLET_RENDER_SCALE, CONFIG.BULLET_RENDER_SCALE);
      // roundRect fallback: use fillRect if roundRect not available
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(-b.w / 2 * scale, -b.h / 2 * scale, b.w * scale, b.h * scale, 3 * scale);
        ctx.fill();
      } else {
        ctx.fillRect(-b.w / 2 * scale, -b.h / 2 * scale, b.w * scale, b.h * scale);
      }
      ctx.restore();
    }
  },

  getActive() { return this.active; },

  recycle(b) {
    b.active = false;
    this.pool.push(b);
  },

  clear() {
    for (const b of this.active) { b.active = false; this.pool.push(b); }
    this.active.length = 0;
  }
};
</script>

<script>
// combat/missileSystem.js - Homing missile projectiles with pooling
const MissileSystem = {
  pool: [],
  active: [],

  init() {
    this.pool = [];
    this.active = [];
  },

  spawn(x, y) {
    let m;
    if (this.pool.length > 0) {
      m = this.pool.pop();
    } else if (this.active.length >= 40) {
      return;
    } else {
      m = { x: 0, y: 0, vx: 0, vy: 0, w: 12, h: 26, dmg: 0, active: false };
    }
    m.x = x;
    m.y = y;
    m.vx = 0;
    m.vy = -CONFIG.MISSILE_SPEED;
    m.dmg = CONFIG.MISSILE_DAMAGE;
    m.active = true;
    this.active.push(m);
  },

  _acquireTarget(m) {
    const enemies = EnemySystem.getActive().filter((e) => e.active);
    let best = null;
    let bestDist = Infinity;
    for (const e of enemies) {
      const dx = e.x - m.x, dy = e.y - m.y;
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = e; }
    }
    const boss = BossSystem.getBoss();
    if (boss && boss.active) {
      const dx = boss.x - m.x, dy = boss.y - m.y;
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = boss; }
    }
    return best;
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const m = this.active[i];
      const target = this._acquireTarget(m);
      const speed = Math.hypot(m.vx, m.vy) || CONFIG.MISSILE_SPEED;
      if (target) {
        const desiredX = target.x - m.x;
        const desiredY = target.y - m.y;
        const desiredDist = Math.hypot(desiredX, desiredY) || 1;
        const desVx = desiredX / desiredDist * speed;
        const desVy = desiredY / desiredDist * speed;
        const maxTurn = CONFIG.MISSILE_TURN_SPEED * dt;
        const curAngle = Math.atan2(m.vy, m.vx);
        const desAngle = Math.atan2(desVy, desVx);
        let diff = desAngle - curAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
        const newAngle = curAngle + turn;
        m.vx = Math.cos(newAngle) * speed;
        m.vy = Math.sin(newAngle) * speed;
      } else {
        m.vx = 0;
        m.vy = -speed;
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.y < -60 || m.y > CONFIG.LOGICAL_HEIGHT + 60 ||
          m.x < -60 || m.x > CONFIG.LOGICAL_WIDTH + 60) {
        m.active = false;
        this.pool.push(m);
        this.active.splice(i, 1);
      }
    }
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    for (const m of this.active) {
      if (!m.active) continue;
      ctx.save();
      ctx.translate(m.x * scale, m.y * scale);
      ctx.rotate(Math.atan2(m.vy, m.vx));
      ctx.scale(CONFIG.MISSILE_RENDER_SCALE, CONFIG.MISSILE_RENDER_SCALE);
      // Flame
      ctx.fillStyle = '#ff9800';
      ctx.beginPath();
      ctx.moveTo(-5 * scale, 0);
      ctx.lineTo(-11 * scale, -3 * scale);
      ctx.lineTo(-11 * scale, 3 * scale);
      ctx.closePath();
      ctx.fill();
      // Body
      ctx.fillStyle = CONFIG.COLORS.missileBody;
      ctx.fillRect(-5 * scale, -2.5 * scale, 14 * scale, 5 * scale);
      // Nose
      ctx.beginPath();
      ctx.moveTo(14 * scale, 0);
      ctx.lineTo(9 * scale, -4 * scale);
      ctx.lineTo(9 * scale, 4 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  },

  getActive() { return this.active; },

  recycle(m) {
    m.active = false;
    this.pool.push(m);
  },

  clear() {
    for (const m of this.active) { m.active = false; this.pool.push(m); }
    this.active.length = 0;
  }
};
</script>

<script>
// combat/laserSystem.js - Instant beam laser to nearest enemy
const LaserSystem = {
  pool: [],
  active: [],

  init() {
    this.pool = [];
    this.active = [];
  },

  fire(x, y) {
    if (this.active.length >= 12) return;

    // Find nearest enemy
    const enemies = EnemySystem.getActive().filter(e => e.active);
    const boss = BossSystem.getBoss();
    let target = null;
    let bestDist = Infinity;

    for (const e of enemies) {
      const d = Math.hypot(e.x - x, e.y - y);
      if (d < bestDist) { bestDist = d; target = e; }
    }
    if (boss && boss.active) {
      const d = Math.hypot(boss.x - x, boss.y - y);
      if (d < bestDist) { bestDist = d; target = boss; }
    }
    if (!target) return;

    let l = this.pool.pop() || { sx: 0, sy: 0, ex: 0, ey: 0, dmg: 0, life: 0, maxLife: 0, active: false };
    l.sx = x;
    l.sy = y - PlayerSystem.height / 2;
    l.ex = target.x;
    l.ey = target.y;
    l.dmg = CONFIG.LASER_DAMAGE;
    l.life = 0.12;
    l.maxLife = 0.12;
    l.active = true;
    this.active.push(l);

    // Apply damage immediately
    if (target === boss) {
      BossSystem.takeDamage(l.dmg);
    } else {
      target.hp -= l.dmg;
      if (target.hp <= 0) {
        CollisionSystem._onEnemyDestroyed(target, EnemySystem.getActive().indexOf(target));
      } else {
        ParticleSystem.spawnHit(target.x, target.y, 3);
      }
    }
    ParticleSystem.spawnHit(target.x, target.y, 4);
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const l = this.active[i];
      l.life -= dt;
      if (l.life <= 0) {
        l.active = false;
        this.pool.push(l);
        this.active.splice(i, 1);
      }
    }
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    for (const l of this.active) {
      if (!l.active) continue;
      const alpha = l.life / l.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;

      // Outer glow
      ctx.strokeStyle = '#1e88e5';
      ctx.lineWidth = 8 * scale;
      ctx.shadowColor = '#29b6f6';
      ctx.shadowBlur = 15 * scale;
      ctx.beginPath();
      ctx.moveTo(l.sx * scale, l.sy * scale);
      ctx.lineTo(l.ex * scale, l.ey * scale);
      ctx.stroke();

      // Core beam
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5 * scale;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(l.sx * scale, l.sy * scale);
      ctx.lineTo(l.ex * scale, l.ey * scale);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.restore();
    }
  },

  getActive() { return this.active; },

  recycle(l) {
    l.active = false;
    this.pool.push(l);
  },

  clear() {
    for (const l of this.active) { l.active = false; this.pool.push(l); }
    this.active.length = 0;
  }
};

<script>
// enemy/enemySystem.js - Data-driven enemy AI
const ENEMY_TYPES = {
  STRAIGHT: {
    name: 'STRAIGHT',
    hp: 3, speed: 100, width: 32, height: 32,
    score: 100, color: CONFIG.COLORS.enemyCommon,
    shootInterval: 0,
    behavior: 'straight'
  },
  SINE: {
    name: 'SINE',
    hp: 3, speed: 80, width: 36, height: 36,
    score: 150, color: CONFIG.COLORS.enemyFast,
    shootInterval: 2.0,
    behavior: 'sine',
    sineAmplitude: 60,
    sineFrequency: 2
  },
  ZIGZAG: {
    name: 'ZIGZAG',
    hp: 3, speed: 90, width: 34, height: 34,
    score: 150, color: CONFIG.COLORS.enemySniper,
    shootInterval: 1.5,
    behavior: 'zigzag',
    zigzagInterval: 0.8,
    zigzagDistance: 40
  },
  CHASE: {
    name: 'CHASE',
    hp: 3, speed: 60, width: 40, height: 40,
    score: 200, color: CONFIG.COLORS.enemyTank,
    shootInterval: 0,
    behavior: 'chase',
    chaseSpeed: 0.3
  },
  CIRCLE: {
    name: 'CIRCLE',
    hp: 5, speed: 50, width: 44, height: 44,
    score: 300, color: '#ec407a',
    shootInterval: 1.0,
    behavior: 'circle',
    circleRadius: 50,
    circleSpeed: 3
  }
};

const EnemySystem = {
  enemies: [],
  time: 0,

  init() {
    this.enemies = [];
    this.time = 0;
  },

  update(dt) {
    this.time += dt;
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      this._updateBehavior(e, dt);

      // Off-screen check
      if (e.y > CONFIG.LOGICAL_HEIGHT + e.h ||
          e.x < -e.w * 2 || e.x > CONFIG.LOGICAL_WIDTH + e.w * 2) {
        this.enemies.splice(i, 1);
        EventBus.emit('enemyOffScreen', { index: i });
      }
    }
  },

  _updateBehavior(e, dt) {
    const type = ENEMY_TYPES[e.type];
    if (!type) return;
    switch (type.behavior) {
      case 'straight':
        e.vy = type.speed;
        e.vx = 0;
        break;
      case 'sine':
        e.vy = type.speed;
        e.vx = Math.sin(this.time * type.sineFrequency * Math.PI * 2) * type.sineAmplitude;
        break;
      case 'zigzag':
        e.vy = type.speed;
        const cycle = Math.floor(this.time / type.zigzagInterval);
        e.vx = (cycle % 2 === 0 ? 1 : -1) * type.zigzagDistance * 3;
        break;
      case 'chase':
        if (PlayerSystem.active) {
          const dx = PlayerSystem.x - e.x;
          const dy = PlayerSystem.y - e.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 0) {
            e.vx = (dx / dist) * type.speed * type.chaseSpeed;
            e.vy = (dy / dist) * type.speed * type.chaseSpeed + type.speed * 0.5;
          }
        } else {
          e.vy = type.speed;
          e.vx = 0;
        }
        break;
      case 'circle':
        e.angle = (e.angle || 0) + type.circleSpeed * dt;
        e.vy = type.speed * 0.5;
        e.vx = Math.cos(e.angle) * type.circleRadius;
        break;
    }

    e.x += e.vx * dt;
    e.y += e.vy * dt;

    // Shooting timer
    if (type.shootInterval > 0) {
      e.shootTimer = (e.shootTimer || 0) + dt;
      if (e.shootTimer >= type.shootInterval && e.y > 0 && e.y < CONFIG.LOGICAL_HEIGHT * 0.7) {
        e.shootTimer = 0;
        EventBus.emit('enemyShoot', { x: e.x, y: e.y + e.h / 2, type: e.type });
      }
    }
  },

  addEnemy(type, x, y) {
    if (this.enemies.length >= CONFIG.MAX_ENEMIES) return null;
    const def = ENEMY_TYPES[type];
    if (!def) return null;
    const enemy = {
      type,
      x, y,
      w: def.width,
      h: def.height,
      vx: 0, vy: 0,
      hp: def.hp,
      maxHp: def.hp,
      active: true,
      shootTimer: 0,
      angle: 0
    };
    this.enemies.push(enemy);
    return enemy;
  },

  removeEnemy(enemy) {
    const idx = this.enemies.indexOf(enemy);
    if (idx >= 0) this.enemies.splice(idx, 1);
  },

  getActive() { return this.enemies; },

  clear() { this.enemies.length = 0; },

  render(ctx) {
    const scale = MobileSystem.getScale();
    for (const e of this.enemies) {
      if (!e.active) continue;
      const def = ENEMY_TYPES[e.type];
      if (!def) continue;
      ctx.save();
      ctx.translate(e.x * scale, e.y * scale);
      ctx.scale(CONFIG.SHIP_RENDER_SCALE, CONFIG.SHIP_RENDER_SCALE);

      // Body
      ctx.fillStyle = def.color;
      ctx.beginPath();
      // Inverted triangle (facing down)
      ctx.moveTo(0, e.h / 2 * scale);
      ctx.lineTo(-e.w / 2 * scale, -e.h / 2 * scale);
      ctx.lineTo(e.w / 2 * scale, -e.h / 2 * scale);
      ctx.closePath();
      ctx.fill();

      // Inner detail
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(0, 0, e.w / 5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // HP bar for multi-hp enemies
      if (e.maxHp > 1) {
        const barW = e.w * scale;
        const barH = 3 * scale;
        const barY = -e.h / 2 * scale - 6 * scale;
        ctx.fillStyle = 'rgba(255,0,0,0.6)';
        ctx.fillRect(-barW / 2, barY, barW, barH);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(-barW / 2, barY, barW * (e.hp / e.maxHp), barH);
      }

      ctx.restore();
    }
  }
};
</script>

<script>
// enemy/spawnSystem.js - Enemy and PowerUp spawn scheduling
const SpawnSystem = {
  spawnTimer: 0,
  spawnInterval: CONFIG.SPAWN_COOLDOWN,
  active: false,

  init() {
    this.spawnTimer = 0;
    this.active = false;
  },

  setWave(wave) {
    // Adjust spawn interval based on wave difficulty
    this.spawnInterval = Math.max(0.2, CONFIG.SPAWN_COOLDOWN - wave * 0.03);
  },

  update(dt) {
    if (!this.active) return;
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer = 0;
      this._spawnEnemy();
    }
  },

  _spawnEnemy() {
    // Quota check: stop spawning once wave target reached
    if (!WaveSystem.canSpawnMore()) return;

    // Choose enemy type based on wave
    const wave = WaveSystem.getCurrentWave();
    const types = ['STRAIGHT'];
    if (wave >= 2) types.push('SINE');
    if (wave >= 3) types.push('ZIGZAG');
    if (wave >= 4) types.push('CHASE');
    if (wave >= 6) types.push('CIRCLE');

    const type = types[Math.floor(Math.random() * types.length)];
    const def = ENEMY_TYPES[type];

    // Safe spawn position (top area) with overlap prevention
    const margin = def.width;
    let x = margin + Math.random() * (CONFIG.LOGICAL_WIDTH - margin * 2);
    const live = EnemySystem.getActive();
    for (let attempt = 0; attempt < 6; attempt++) {
      const overlap = live.some(e => e.y < 150 && Math.abs(e.x - x) < (e.w + def.width) / 2 + 12);
      if (!overlap) break;
      x = margin + Math.random() * (CONFIG.LOGICAL_WIDTH - margin * 2);
    }
    const y = -def.height;

    const enemy = EnemySystem.addEnemy(type, x, y);
    if (enemy) {
      // Apply wave-based difficulty scaling (defensive: always finite and >= 1)
      const hpMultiplier = 1 + (wave - 1) * 0.2;
      const hp = Math.ceil(def.hp * hpMultiplier);
      enemy.hp = Number.isFinite(hp) && hp >= 1 ? hp : 1;
      enemy.maxHp = enemy.hp;
      EventBus.emit('enemySpawned', { type: enemy.type });
    }
  },

  spawnPowerUp(x, y, type) {
    PowerUpSystem.spawn(x, y, type);
  },

  start() {
    this.active = true;
    this.spawnTimer = 0;
    // Spawn the first enemy immediately so enemies appear right at the start,
    // then keep spawning at the regular interval.
    this._spawnEnemy();
  },
  stop() { this.active = false; },
  reset() { this.active = false; this.spawnTimer = 0; }
};
</script>

<script>
// enemy/bossSystem.js - Boss multi-phase AI
const BossSystem = {
  boss: null,
  active: false,
  phase: 1,
  phaseThreshold: 0.5,
  attackTimer: 0,
  attackInterval: 1.5,
  patternIndex: 0,
  moveDirection: 1,
  bossType: null,
  chargeTimer: 0,
  isCharging: false,
  isFiring: false,
  fireTimer: 0,
  fireAngle: 0,

  init() {
    this.boss = null;
    this.active = false;
  },

  reset() {
    this.boss = null;
    this.active = false;
    this.phase = 1;
    this.attackTimer = 0;
    this.attackInterval = 1.5;
    this.patternIndex = 0;
    this.moveDirection = 1;
    this.bossType = null;
    this.chargeTimer = 0;
    this.isCharging = false;
    this.isFiring = false;
    this.fireTimer = 0;
    this.fireAngle = 0;
    this.glowPhase = 0;
    this.glowTimer = 0;
    this.glowDuration = 0.8;
  },

  spawn() {
    if (this.active) return;
    this.active = true;
    this.phase = 1;
    this.attackTimer = 0;
    this.attackInterval = 1.5;
    this.patternIndex = 0;
    this.moveDirection = 1;
    this.chargeTimer = 0;
    this.isCharging = false;
    this.isFiring = false;
    this.fireTimer = 0;
    this.fireAngle = 0;

    // Select boss type based on wave number
    const wave = WaveSystem.getCurrentWave();
    const types = Object.keys(BOSS_TYPES);
    const typeIndex = (wave - 1) % types.length;
    this.bossType = BOSS_TYPES[types[typeIndex]];

    this.boss = {
      x: CONFIG.LOGICAL_WIDTH / 2,
      y: -CONFIG.BOSS_HEIGHT,
      w: CONFIG.BOSS_WIDTH,
      h: CONFIG.BOSS_HEIGHT,
      vx: 0,
      vy: CONFIG.BOSS_SPEED,
      hp: CONFIG.BOSS_HP,
      maxHp: CONFIG.BOSS_HP,
      active: true,
      entering: true
    };

    EventBus.emit('bossSpawned', {});
    SpawnSystem.stop();
  },

  update(dt) {
    if (!this.active || !this.boss) return;
    const b = this.boss;

    // Entry phase
    if (b.entering) {
      b.y += CONFIG.BOSS_SPEED * dt;
      if (b.y >= 230) {
        b.y = 230;
        b.entering = false;
        b.vy = 0;
      }
      return;
    }

    // Horizontal movement
    b.vx = this.moveDirection * CONFIG.BOSS_SPEED * 1.5;
    b.x += b.vx * dt;
    if (b.x > CONFIG.LOGICAL_WIDTH - b.w / 2 - 10) this.moveDirection = -1;
    if (b.x < b.w / 2 + 10) this.moveDirection = 1;

    // Phase check
    const hpRatio = b.hp / b.maxHp;
    if (this.phase === 1 && hpRatio <= this.phaseThreshold) {
      this.phase = 2;
      this.attackInterval = 0.8;
      EventBus.emit('bossPhaseChange', { phase: 2 });
      CameraSystem.shake(10, 0.5);
    }

    // Large weapon charging and firing
    if (this.phase >= 2 && !this.isFiring && !this.isCharging) {
      this.chargeTimer += dt;
      if (this.chargeTimer >= this.bossType.chargeTime) {
        this.isCharging = true;
        this.chargeTimer = 0;
        this.glowPhase = 0;
        this.glowTimer = 0;
        this.glowDuration = 0.8;
      }
    }

    // Glow animation phase
    if (this.isCharging && !this.isFiring) {
      this.glowTimer += dt;
      const halfDuration = this.glowDuration / 2;
      
      if (this.glowTimer < halfDuration) {
        this.glowPhase = 0;
      } else if (this.glowTimer < this.glowDuration) {
        this.glowPhase = 1;
      } else {
        this.isFiring = true;
        this.fireTimer = 0;
        this.fireAngle = 0;
      }
    }

    if (this.isFiring) {
      this.fireTimer += dt;
      this.fireAngle += dt * 3;
      
      this._executeLargeWeapon(dt);
      
      if (this.fireTimer >= this.bossType.fireDuration) {
        this.isFiring = false;
        this.isCharging = false;
        this.fireTimer = 0;
        this.chargeTimer = 0;
      }
    }

    // Attack patterns
    this.attackTimer += dt;
    if (this.attackTimer >= this.attackInterval) {
      this.attackTimer = 0;
      this._executePattern();
    }
  },

  _executePattern() {
    const b = this.boss;
    const cx = b.x;
    const cy = b.y + b.h / 2;

    switch (this.patternIndex % 4) {
      case 0: // Straight spread
        for (let i = -3; i <= 3; i++) {
          EventBus.emit('bossShoot', { x: cx, y: cy, vx: i * 40, vy: CONFIG.ENEMY_BULLET_SPEED });
        }
        break;
      case 1: // Circle burst
        if (this.phase >= 2) {
          const count = 12;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            EventBus.emit('bossShoot', {
              x: cx, y: cy,
              vx: Math.cos(angle) * CONFIG.ENEMY_BULLET_SPEED,
              vy: Math.sin(angle) * CONFIG.ENEMY_BULLET_SPEED
            });
          }
        } else {
          // Fallback: 3 straight
          for (let i = -1; i <= 1; i++) {
            EventBus.emit('bossShoot', { x: cx + i * 20, y: cy, vx: 0, vy: CONFIG.ENEMY_BULLET_SPEED });
          }
        }
        break;
      case 2: // Aimed shots
        if (PlayerSystem.active) {
          const dx = PlayerSystem.x - cx;
          const dy = PlayerSystem.y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 0) {
            const speed = CONFIG.ENEMY_BULLET_SPEED * 1.2;
            EventBus.emit('bossShoot', { x: cx, y: cy, vx: (dx / dist) * speed, vy: (dy / dist) * speed });
          }
        }
        break;
      case 3: // Double spread
        for (let i = -2; i <= 2; i++) {
          EventBus.emit('bossShoot', { x: cx, y: cy, vx: i * 60, vy: CONFIG.ENEMY_BULLET_SPEED * 0.8 });
        }
        break;
    }
    this.patternIndex++;
  },

  _executeLargeWeapon(dt) {
    const b = this.boss;
    const cx = b.x;
    const cy = b.y + b.h / 2;
    const weaponType = this.bossType.weaponType;

    switch (weaponType) {
      case 'beams': // Triangle boss - three beams shooting down
        for (let i = -1; i <= 1; i++) {
          const angle = Math.PI / 2 + i * 0.3;
          const speed = CONFIG.ENEMY_BULLET_SPEED * 1.5;
          EventBus.emit('bossShoot', {
            x: cx + i * 30, y: cy,
            vx: Math.cos(angle) * speed * 0.3,
            vy: speed
          });
        }
        break;

      case 'spiral': // Hexagon boss - spiral pattern
        const spiralCount = 8;
        for (let i = 0; i < spiralCount; i++) {
          const angle = this.fireAngle + (i / spiralCount) * Math.PI * 2;
          const speed = CONFIG.ENEMY_BULLET_SPEED;
          EventBus.emit('bossShoot', {
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed + speed * 0.5
          });
        }
        break;

      case 'wave': // Diamond boss - wave pattern
        const waveCount = 12;
        for (let i = 0; i < waveCount; i++) {
          const offset = Math.sin(this.fireAngle * 2 + i * 0.5) * 100;
          EventBus.emit('bossShoot', {
            x: cx + offset, y: cy,
            vx: 0, vy: CONFIG.ENEMY_BULLET_SPEED * 1.2
          });
        }
        break;

      case 'rain': // Star boss - rain from above
        const rainCount = 15;
        for (let i = 0; i < rainCount; i++) {
          const x = (Math.random() - 0.5) * CONFIG.LOGICAL_WIDTH;
          EventBus.emit('bossShoot', {
            x: x, y: -20,
            vx: (Math.random() - 0.5) * 50,
            vy: CONFIG.ENEMY_BULLET_SPEED * 1.3
          });
        }
        break;
    }
  },

  takeDamage(damage) {
    if (!this.boss || !this.boss.active) return;
    this.boss.hp -= damage;
    if (this.boss.hp <= 0) {
      this.boss.hp = 0;
      this.boss.active = false;
      EventBus.emit('bossDefeated', { x: this.boss.x, y: this.boss.y });
      this.active = false;
      this.boss = null;
    }
  },

  getBoss() { return this.boss; },

  render(ctx) {
    if (!this.boss || !this.boss.active) return;
    const b = this.boss;
    const scale = MobileSystem.getScale();
    ctx.save();
    ctx.translate(b.x * scale, b.y * scale);
    ctx.scale(CONFIG.SHIP_RENDER_SCALE, CONFIG.SHIP_RENDER_SCALE);

    const bossType = this.bossType;
    const shape = bossType.shape;

    // Draw different shapes based on boss type
    if (shape === 'triangle') {
      // Triangle boss
      ctx.fillStyle = bossType.color;
      ctx.beginPath();
      ctx.moveTo(0, -b.h / 2 * scale);
      ctx.lineTo(-b.w / 2 * scale, b.h / 2 * scale);
      ctx.lineTo(b.w / 2 * scale, b.h / 2 * scale);
      ctx.closePath();
      ctx.fill();

      // Wings
      ctx.fillStyle = bossType.wingColor;
      ctx.beginPath();
      ctx.moveTo(-b.w / 2 * scale, b.h / 4 * scale);
      ctx.lineTo(-b.w / 2 * scale - 15 * scale, b.h / 2 * scale);
      ctx.lineTo(-b.w / 4 * scale, b.h / 2 * scale);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(b.w / 2 * scale, b.h / 4 * scale);
      ctx.lineTo(b.w / 2 * scale + 15 * scale, b.h / 2 * scale);
      ctx.lineTo(b.w / 4 * scale, b.h / 2 * scale);
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'hexagon') {
      // Hexagon boss
      ctx.fillStyle = bossType.color;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * b.w / 2 * scale;
        const y = Math.sin(angle) * b.h / 2 * scale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();

      // Inner hexagon
      ctx.fillStyle = bossType.wingColor;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * b.w / 3 * scale;
        const y = Math.sin(angle) * b.h / 3 * scale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'diamond') {
      // Diamond boss
      ctx.fillStyle = bossType.color;
      ctx.beginPath();
      ctx.moveTo(0, -b.h / 2 * scale);
      ctx.lineTo(-b.w / 2 * scale, 0);
      ctx.lineTo(0, b.h / 2 * scale);
      ctx.lineTo(b.w / 2 * scale, 0);
      ctx.closePath();
      ctx.fill();

      // Wings
      ctx.fillStyle = bossType.wingColor;
      ctx.beginPath();
      ctx.moveTo(-b.w / 2 * scale, 0);
      ctx.lineTo(-b.w / 2 * scale - 10 * scale, -b.h / 4 * scale);
      ctx.lineTo(-b.w / 2 * scale - 10 * scale, b.h / 4 * scale);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(b.w / 2 * scale, 0);
      ctx.lineTo(b.w / 2 * scale + 10 * scale, -b.h / 4 * scale);
      ctx.lineTo(b.w / 2 * scale + 10 * scale, b.h / 4 * scale);
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'star') {
      // Star boss
      ctx.fillStyle = bossType.color;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * b.w / 2 * scale;
        const y = Math.sin(angle) * b.h / 2 * scale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);

        const innerAngle = angle + Math.PI / 5;
        const innerX = Math.cos(innerAngle) * b.w / 4 * scale;
        const innerY = Math.sin(innerAngle) * b.h / 4 * scale;
        ctx.lineTo(innerX, innerY);
      }
      ctx.closePath();
      ctx.fill();

      // Wings
      ctx.fillStyle = bossType.wingColor;
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(angle) * b.w / 2 * scale;
        const y = Math.sin(angle) * b.h / 2 * scale;
        ctx.beginPath();
        ctx.arc(x, y, 8 * scale, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Core
    const coreColor = this.phase >= 2 ? bossType.coreColor : bossType.color;
    ctx.fillStyle = coreColor;
    ctx.beginPath();
    ctx.arc(0, 0, 12 * scale, 0, Math.PI * 2);
    ctx.fill();

    // Charging visual - weapon color glow expanding and contracting
    if (this.isCharging && !this.isFiring) {
      const halfDuration = this.glowDuration / 2;
      let glowSize;
      
      if (this.glowPhase === 0) {
        // Expanding phase
        const progress = this.glowTimer / halfDuration;
        glowSize = 40 + progress * 80; // 40 to 120
      } else {
        // Contracting phase
        const progress = (this.glowTimer - halfDuration) / halfDuration;
        glowSize = 120 - progress * 80; // 120 to 40
      }
      
      const glowAlpha = 0.6 + Math.sin(Date.now() * 0.015) * 0.3;
      const wc = bossType.weaponColor;
      
      // Outer glow
      ctx.fillStyle = `${wc}${Math.floor(glowAlpha * 0.3 * 255).toString(16).padStart(2, '0')}`;
      ctx.beginPath();
      ctx.arc(0, 0, glowSize * scale, 0, Math.PI * 2);
      ctx.fill();
      
      // Middle glow
      ctx.fillStyle = `${wc}${Math.floor(glowAlpha * 0.5 * 255).toString(16).padStart(2, '0')}`;
      ctx.beginPath();
      ctx.arc(0, 0, glowSize * 0.7 * scale, 0, Math.PI * 2);
      ctx.fill();
      
      // Inner glow
      ctx.fillStyle = `${wc}${Math.floor(glowAlpha * 0.7 * 255).toString(16).padStart(2, '0')}`;
      ctx.beginPath();
      ctx.arc(0, 0, glowSize * 0.4 * scale, 0, Math.PI * 2);
      ctx.fill();
      
      // Glow ring
      ctx.strokeStyle = `${wc}${Math.floor(glowAlpha * 255).toString(16).padStart(2, '0')}`;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.arc(0, 0, glowSize * scale, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Firing visual
    if (this.isFiring) {
      const fireAlpha = 0.7 + Math.sin(Date.now() * 0.02) * 0.3;
      const wc = bossType.weaponColor;
      
      ctx.fillStyle = `${wc}${Math.floor(fireAlpha * 255).toString(16).padStart(2, '0')}`;
      ctx.beginPath();
      ctx.arc(0, 0, 16 * scale, 0, Math.PI * 2);
      ctx.fill();
      
      // Firing rays
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const rayLength = 30 + Math.sin(Date.now() * 0.01 + i) * 10;
        ctx.strokeStyle = `${wc}${Math.floor(fireAlpha * 0.6 * 255).toString(16).padStart(2, '0')}`;
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * rayLength * scale, Math.sin(angle) * rayLength * scale);
        ctx.stroke();
      }
    }

    // HP bar
    const barW = (b.w + 40) * scale;
    const barH = 6 * scale;
    const barY = -b.h / 2 * scale - 14 * scale;
    ctx.fillStyle = 'rgba(255,0,0,0.5)';
    ctx.fillRect(-barW / 2, barY, barW, barH);
    ctx.fillStyle = bossType.color;
    ctx.fillRect(-barW / 2, barY, barW * (b.hp / b.maxHp), barH);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(-barW / 2, barY, barW, barH);

    // Phase label and weapon info
    ctx.fillStyle = '#fff';
    ctx.font = `${10 * scale * CONFIG.UI_FONT_SCALE / CONFIG.SHIP_RENDER_SCALE}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`PHASE ${this.phase}`, 0, barY - 4 * scale);
    
    // Weapon name
    if (this.phase >= 2) {
      ctx.fillStyle = bossType.coreColor;
      ctx.fillText(bossType.weaponDesc, 0, barY - 16 * scale);
    }

    ctx.restore();
  }
};
</script>

<script>
// combat/enemyBulletSystem.js - Enemy bullet management with object pooling
const EnemyBulletSystem = {
  pool: [],
  active: [],

  init() {
    this.pool = [];
    this.active = [];
    for (let i = 0; i < CONFIG.MAX_ENEMY_BULLETS; i++) {
      this.pool.push({ x: 0, y: 0, w: CONFIG.ENEMY_BULLET_WIDTH, h: CONFIG.ENEMY_BULLET_HEIGHT, vx: 0, vy: 0, hp: 1, active: false });
    }
    // Listen for enemy shoot events
    EventBus.on('enemyShoot', (data) => this._onEnemyShoot(data));
    EventBus.on('bossShoot', (data) => this._onBossShoot(data));
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const b = this.active[i];
      // Homing behavior
      if (b.homing && PlayerSystem.active) {
        const dx = PlayerSystem.x - b.x;
        const dy = PlayerSystem.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 0) {
          const targetVx = (dx / dist) * CONFIG.ENEMY_BULLET_SPEED;
          const targetVy = (dy / dist) * CONFIG.ENEMY_BULLET_SPEED;
          b.vx += (targetVx - b.vx) * 2 * dt;
          b.vy += (targetVy - b.vy) * 2 * dt;
        }
      }
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // Off-screen check
      if (b.y > CONFIG.LOGICAL_HEIGHT + b.h || b.y < -b.h * 2 ||
          b.x < -b.w * 2 || b.x > CONFIG.LOGICAL_WIDTH + b.w * 2) {
        b.active = false;
        this.pool.push(b);
        this.active.splice(i, 1);
      }
    }
  },

  _onEnemyShoot(data) {
    // Data-driven patterns per enemy type: straight / spread / aimed / homing
    const speed = CONFIG.ENEMY_BULLET_SPEED;
    switch (data.type) {
      case 'SINE':
        this.spawnSpread(data.x, data.y, 3, 0.25);
        break;
      case 'CHASE':
        if (PlayerSystem.active) {
          this.spawnHoming(data.x, data.y, PlayerSystem.x, PlayerSystem.y);
        } else {
          this._spawn(data.x, data.y, 0, speed, false);
        }
        break;
      case 'ZIGZAG':
        this._aimed(data.x, data.y, speed * 1.1);
        break;
      case 'CIRCLE':
        this.spawnSpread(data.x, data.y, 2, 0.3);
        break;
      default:
        this._spawn(data.x, data.y, 0, speed, false);
        break;
    }
  },

  _aimed(x, y, speed) {
    if (!PlayerSystem.active) {
      this._spawn(x, y, 0, speed, false);
      return;
    }
    const dx = PlayerSystem.x - x;
    const dy = PlayerSystem.y - y;
    const dist = Math.hypot(dx, dy);
    if (!Number.isFinite(dist) || dist === 0) {
      this._spawn(x, y, 0, speed, false);
      return;
    }
    this._spawn(x, y, (dx / dist) * speed, (dy / dist) * speed, false);
  },

  _onBossShoot(data) {
    this._spawn(data.x, data.y, data.vx || 0, data.vy || CONFIG.ENEMY_BULLET_SPEED, false, true);
  },

  spawnSpread(x, y, count, spreadAngle) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI / 2) + (i - (count - 1) / 2) * spreadAngle;
      const speed = CONFIG.ENEMY_BULLET_SPEED;
      this._spawn(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, false);
    }
  },

  spawnCircle(x, y, count) {
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const speed = CONFIG.ENEMY_BULLET_SPEED * 0.7;
      this._spawn(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, false);
    }
  },

  spawnHoming(x, y, targetX, targetY) {
    let b;
    if (this.pool.length > 0) {
      b = this.pool.pop();
    } else if (this.active.length >= CONFIG.MAX_ENEMY_BULLETS) {
      return;
    } else {
      b = { x: 0, y: 0, w: CONFIG.ENEMY_BULLET_WIDTH, h: CONFIG.ENEMY_BULLET_HEIGHT, vx: 0, vy: 0, hp: 1, active: false };
    }
    const dx = targetX - x;
    const dy = targetY - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    b.x = x;
    b.y = y;
    b.vx = (dx / dist) * CONFIG.ENEMY_BULLET_SPEED * 0.7;
    b.vy = (dy / dist) * CONFIG.ENEMY_BULLET_SPEED * 0.7;
    b.hp = CONFIG.ENEMY_BULLET_DAMAGE;
    b.active = true;
    b.homing = true;
    this.active.push(b);
  },

  _spawn(x, y, vx, vy, homing, isBoss) {
    if (this.active.length >= CONFIG.MAX_ENEMY_BULLETS && this.pool.length === 0) return;
    let b;
    if (this.pool.length > 0) {
      b = this.pool.pop();
    } else {
      b = { x: 0, y: 0, w: CONFIG.ENEMY_BULLET_WIDTH, h: CONFIG.ENEMY_BULLET_HEIGHT, vx: 0, vy: 0, hp: 1, active: false };
    }
    b.x = x;
    b.y = y;
    b.vx = vx;
    b.vy = vy;
    b.hp = CONFIG.ENEMY_BULLET_DAMAGE;
    b.active = true;
    b.homing = homing || false;
    b.isBoss = isBoss || false;
    this.active.push(b);
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    for (const b of this.active) {
      if (!b.active) continue;
      ctx.save();
      ctx.translate(b.x * scale, b.y * scale);
      ctx.scale(CONFIG.BULLET_RENDER_SCALE, CONFIG.BULLET_RENDER_SCALE);
      
      // Use different color for boss bullets
      ctx.fillStyle = b.isBoss ? CONFIG.COLORS.bossBullet : CONFIG.COLORS.enemyBullet;
      
      ctx.beginPath();
      ctx.arc(0, 0, b.w / 2 * scale, 0, Math.PI * 2);
      ctx.fill();
      if (b.homing) {
        ctx.strokeStyle = 'rgba(255, 82, 82, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, b.w / 2 * scale + 2 * scale, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  },

  getActive() { return this.active; },

  recycle(b) {
    b.active = false;
    b.homing = false;
    this.pool.push(b);
  },

  clear() {
    for (const b of this.active) { b.active = false; b.homing = false; this.pool.push(b); }
    this.active.length = 0;
  }
};
</script>

<script>
// combat/collisionSystem.js - Centralized collision handling
const CollisionSystem = {
  init() {
    EventBus.on('update', () => this.checkCollisions());
  },

  checkCollisions() {
    // Use the global GameState variable
    if (typeof GameState !== 'undefined' && GameState !== 'PLAYING') return;

    // Player bullets vs Enemies
    const bullets = BulletSystem.getActive();
    const enemies = EnemySystem.getActive();

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (!b.active) continue;

      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!e.active) continue;
        if (this._aabb(b, e)) {
          e.hp -= b.hp;
          b.active = false;
          BulletSystem.recycle(b);
          bullets.splice(i, 1);

          if (e.hp <= 0) {
            this._onEnemyDestroyed(e, j);
          } else {
            ParticleSystem.spawnHit(e.x, e.y, 3);
          }
          break;
        }
      }
    }

    // Player bullets vs Boss
    const boss = BossSystem.getBoss();
    if (boss && boss.active) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b.active) continue;
        if (this._aabb(b, boss)) {
          BossSystem.takeDamage(b.hp);
          b.active = false;
          BulletSystem.recycle(b);
          bullets.splice(i, 1);
          ParticleSystem.spawnHit(boss.x + (Math.random() - 0.5) * boss.w, boss.y + (Math.random() - 0.5) * boss.h, 2);
        }
      }
    }

    // Missiles vs Enemies (homing, consumed on hit)
    const missiles = MissileSystem.getActive();
    for (let i = missiles.length - 1; i >= 0; i--) {
      const m = missiles[i];
      if (!m.active) continue;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (!e.active) continue;
        if (this._aabb(m, e)) {
          e.hp -= m.dmg;
          m.active = false;
          MissileSystem.recycle(m);
          missiles.splice(i, 1);
          ParticleSystem.spawnExplosion(m.x, m.y, 10);
          if (e.hp <= 0) {
            this._onEnemyDestroyed(e, j);
          } else {
            ParticleSystem.spawnHit(e.x, e.y, 3);
          }
          break;
        }
      }
    }

    // Missiles vs Boss
    if (boss && boss.active) {
      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        if (!m.active) continue;
        if (this._aabb(m, boss)) {
          BossSystem.takeDamage(m.dmg);
          m.active = false;
          MissileSystem.recycle(m);
          missiles.splice(i, 1);
          ParticleSystem.spawnExplosion(m.x, m.y, 10);
        }
      }
    }

    // Enemy bullets vs Player
    const enemyBullets = EnemyBulletSystem.getActive();
    if (PlayerSystem.active) {
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (!b.active) continue;
        if (this._circleAabb(b, PlayerSystem)) {
          PlayerSystem.takeDamage(b.hp);
          b.active = false;
          EnemyBulletSystem.recycle(b);
          enemyBullets.splice(i, 1);
          ParticleSystem.spawnHit(PlayerSystem.x, PlayerSystem.y, 5);
        }
      }
    }

    // Enemies vs Player (collision)
    if (PlayerSystem.active) {
      for (const e of enemies) {
        if (!e.active) continue;
        if (this._aabb(PlayerSystem, e)) {
          PlayerSystem.takeDamage(1);
          e.hp -= 2;
          if (e.hp <= 0) {
            this._onEnemyDestroyed(e, enemies.indexOf(e));
          }
          ParticleSystem.spawnExplosion(PlayerSystem.x, PlayerSystem.y, 8);
        }
      }
    }

    // Boss vs Player
    if (boss && boss.active && PlayerSystem.active) {
      if (this._aabb(PlayerSystem, boss)) {
        PlayerSystem.takeDamage(1);
        ParticleSystem.spawnExplosion(PlayerSystem.x, PlayerSystem.y, 8);
      }
    }

    // PowerUps vs Player
    if (PlayerSystem.active) {
      PowerUpSystem.checkPlayerCollision(PlayerSystem);
    }
  },

  _aabb(a, b) {
    return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
           Math.abs(a.y - b.y) < (a.h + b.h) / 2;
  },

  _circleAabb(circle, rect) {
    const dx = Math.abs(circle.x - rect.x);
    const dy = Math.abs(circle.y - rect.y);
    return dx < (circle.w / 2 + rect.w / 2) && dy < (circle.h / 2 + rect.h / 2);
  },

  _onEnemyDestroyed(enemy, index) {
    const def = ENEMY_TYPES[enemy.type];
    if (!def) return;
    const score = def.score * ScoreSystem.getComboMultiplier();
    ScoreSystem.addScore(score);
    ScoreSystem.addCombo();
    ParticleSystem.spawnExplosion(enemy.x, enemy.y, 12);

    // Chance to drop powerup
    if (Math.random() < 0.09) {
      const types = ['POWER', 'RAPID', 'SPREAD', 'SHIELD', 'HEALTH', 'MISSILE', 'LASER'];
      const type = types[Math.floor(Math.random() * types.length)];
      SpawnSystem.spawnPowerUp(enemy.x, enemy.y, type);
    }

    EnemySystem.removeEnemy(enemy);
    EventBus.emit('enemyDestroyed', { type: enemy.type, score });
  }
};
</script>

<script>
// systems/waveSystem.js - Wave progress and difficulty management
const WaveSystem = {
  currentWave: 0,
  enemiesToSpawn: 0,
  spawnedCount: 0,
  aliveCount: 0,
  waveClearTimer: 0,
  waveState: 'IDLE', // IDLE / SPAWNING / CLEARING / BOSS
  maxWaves: CONFIG.MAX_WAVES,
  waveTransitionTimer: 0,
  showingTransition: false,
  bossPending: false,
  bossTimer: 0,

  init() {
    this.currentWave = 0;
    this.waveState = 'IDLE';
    EventBus.on('enemySpawned', () => { this.spawnedCount++; this.aliveCount++; });
    EventBus.on('enemyDestroyed', () => { this.aliveCount = Math.max(0, this.aliveCount - 1); });
    EventBus.on('enemyOffScreen', () => { this.aliveCount = Math.max(0, this.aliveCount - 1); });
    EventBus.on('bossDefeated', () => this._onBossDefeated());
  },

  start() {
    this.currentWave = 0;
    this.waveState = 'IDLE';
    this.spawnedCount = 0;
    this.aliveCount = 0;
    this.bossPending = false;
    this.bossTimer = 0;
    this.waveClearTimer = 0;
    this.showingTransition = false;
    this.waveTransitionTimer = 0;
    this._nextWave();
  },

  update(dt) {
    // Boss spawn via in-game timer
    if (this.bossPending) {
      this.bossTimer -= dt;
      if (this.bossTimer <= 0) {
        this.bossPending = false;
        BossSystem.spawn();
      }
    }

    if (this.showingTransition) {
      this.waveTransitionTimer -= dt;
      if (this.waveTransitionTimer <= 0) {
        this.showingTransition = false;
      }
    }

    if (this.waveState === 'SPAWNING') {
      // Wave clears when all quota spawned AND no enemies remain (destroyed or escaped)
      if (this.spawnedCount >= this.enemiesToSpawn && this.aliveCount <= 0) {
        this.waveState = 'CLEARING';
        this.waveClearTimer = CONFIG.WAVE_CLEAR_DELAY;
        SpawnSystem.stop();
        EventBus.emit('waveCleared', { wave: this.currentWave });
      }
    } else if (this.waveState === 'CLEARING') {
      this.waveClearTimer -= dt;
      if (this.waveClearTimer <= 0) {
        this._nextWave();
      }
    }
  },

  _nextWave() {
    this.currentWave++;
    if (this.currentWave > this.maxWaves) {
      this.waveState = 'IDLE';
      EventBus.emit('gameVictory', {});
      return;
    }

    // Boss wave check
    if (this.currentWave % CONFIG.BOSS_WAVE_THRESHOLD === 0) {
      this.waveState = 'BOSS';
      this.showingTransition = true;
      this.waveTransitionTimer = 2.0;
      this.bossPending = true;
      this.bossTimer = 1.5;
      EventBus.emit('waveTransition', { wave: this.currentWave, isBoss: true });
      return;
    }

    this.enemiesToSpawn = CONFIG.WAVE_ENEMY_COUNT + this.currentWave * 2;
    this.spawnedCount = 0;
    this.aliveCount = 0;
    this.waveState = 'SPAWNING';
    this.showingTransition = true;
    this.waveTransitionTimer = 1.5;
    SpawnSystem.setWave(this.currentWave);
    SpawnSystem.start();
    EventBus.emit('waveTransition', { wave: this.currentWave, isBoss: false, count: this.enemiesToSpawn });
  },

  _onBossDefeated() {
    if (this.waveState !== 'BOSS') return;
    this.waveState = 'CLEARING';
    this.waveClearTimer = 3.0;
    EventBus.emit('waveCleared', { wave: this.currentWave });
  },

  getCurrentWave() { return this.currentWave; },
  getWaveState() { return this.waveState; },
  isShowingTransition() { return this.showingTransition; },
  canSpawnMore() { return this.spawnedCount < this.enemiesToSpawn; },
  getEnemiesRemaining() {
    return Math.max(0, (this.enemiesToSpawn - this.spawnedCount) + this.aliveCount);
  }
};
</script>

<script>
// systems/powerUpSystem.js - PowerUp drop and effect management
const PowerUpSystem = {
  pool: [],
  active: [],

  init() {
    this.pool = [];
    this.active = [];
  },

  spawn(x, y, type) {
    if (this.active.length >= CONFIG.MAX_POWERUPS) return;
    const p = this.pool.pop() || {
      x: 0, y: 0,
      w: CONFIG.POWERUP_WIDTH,
      h: CONFIG.POWERUP_HEIGHT,
      vy: 0,
      type: '',
      active: false,
      bobPhase: 0
    };
    p.x = x;
    p.y = y;
    p.vy = CONFIG.POWERUP_SPEED;
    p.type = type;
    p.bobPhase = Math.random() * Math.PI * 2;
    p.labelTimer = 3.0;
    p.active = true;
    this.active.push(p);
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const p = this.active[i];
      p.y += p.vy * dt;
      p.bobPhase += dt * 3;
      if (p.labelTimer > 0) p.labelTimer -= dt;
      if (p.y > CONFIG.LOGICAL_HEIGHT + p.h) {
        this.recycle(p);
        this.active.splice(i, 1);
      }
    }
  },

  checkPlayerCollision(player) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const p = this.active[i];
      if (!p.active) continue;
      const dx = Math.abs(p.x - player.x);
      const dy = Math.abs(p.y - player.y);
      if (dx < (p.w + player.w) / 2 && dy < (p.h + player.h) / 2) {
        PlayerSystem.applyPowerUp(p.type);
        ParticleSystem.spawnPowerUp(p.x, p.y);
        this.recycle(p);
        this.active.splice(i, 1);
      }
    }
  },

  recycle(p) {
    p.active = false;
    p.labelTimer = 0;
    this.pool.push(p);
  },

  clear() {
    for (const p of this.active) this.recycle(p);
    this.active.length = 0;
  },

  getColor(type) {
    const map = {
      POWER: CONFIG.COLORS.powerUpPower,
      RAPID: CONFIG.COLORS.powerUpRapid,
      SPREAD: CONFIG.COLORS.powerUpSpread,
      SHIELD: CONFIG.COLORS.powerUpShield,
      HEALTH: CONFIG.COLORS.powerUpHealth,
      MISSILE: CONFIG.COLORS.powerUpMissile,
      LASER: CONFIG.COLORS.powerUpLaser
    };
    return map[type] || '#fff';
  },

  getLabel(type) {
    const map = { POWER: 'P', RAPID: 'R', SPREAD: 'S', SHIELD: 'H', HEALTH: '+', MISSILE: 'M', LASER: 'L' };
    return map[type] || '?';
  },

  getInfo(type) {
    const map = {
      POWER:  { name: '火力', desc: '火力等級 +1' },
      RAPID:  { name: '連射', desc: '射速提升' },
      SPREAD: { name: '散射', desc: '三向彈幕' },
      SHIELD: { name: '護盾', desc: '抵擋一次傷害' },
      HEALTH: { name: '回復', desc: '生命 +3' },
      MISSILE: { name: '飛彈', desc: '發射追蹤飛彈' },
      LASER: { name: '雷射', desc: '穿透雷射' }
    };
    return map[type] || { name: type, desc: '' };
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    for (const p of this.active) {
      if (!p.active) continue;
      const bob = Math.sin(p.bobPhase) * 3;
      ctx.save();
      ctx.translate(p.x * scale, (p.y + bob) * scale);

      // Disc + letter (slightly enlarged so the bigger letter fits)
      ctx.save();
      ctx.scale(1.6, 1.6);

      // Outer glow
      ctx.fillStyle = this.getColor(p.type) + '44';
      ctx.beginPath();
      ctx.arc(0, 0, p.w / 2 * scale + 4 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = this.getColor(p.type);
      ctx.beginPath();
      ctx.arc(0, 0, p.w / 2 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${14 * scale}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(this.getLabel(p.type), 0, 0);
      ctx.restore();

      // Floating name + function label (shown briefly when the item drops)
      if (p.labelTimer > 0) {
        const alpha = Math.min(1, p.labelTimer / 1.5);
        const info = this.getInfo(p.type);
        const fontScale = CONFIG.UI_FONT_SCALE;
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${14 * fontScale * scale}px monospace`;
        ctx.fillText(info.name, 0, -p.h / 2 * scale - 34 * scale);
        ctx.font = `${13 * fontScale * scale}px monospace`;
        ctx.fillStyle = this.getColor(p.type);
        ctx.fillText(info.desc, 0, -p.h / 2 * scale - 70 * scale);
        ctx.globalAlpha = 1;
        ctx.textBaseline = 'alphabetic';
      }

      ctx.restore();
    }
  }
};
</script>

<script>
// systems/particleSystem.js - Explosion/hit/special particles with pooling
const ParticleSystem = {
  pool: [],
  active: [],
  maxParticles: CONFIG.MAX_PARTICLES,

  init() {
    this.pool = [];
    this.active = [];
  },

  update(dt) {
    for (let i = this.active.length - 1; i >= 0; i--) {
      const p = this.active[i];
      p.life -= dt;
      if (p.life <= 0) {
        p.active = false;
        this.pool.push(p);
        this.active.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.gravity || 0) * dt;
      p.alpha = Math.max(0, p.life / p.maxLife);
    }
  },

  _spawn(x, y, count, config) {
    for (let i = 0; i < count; i++) {
      if (this.active.length >= this.maxParticles) return;
      const p = this.pool.pop() || {
        x: 0, y: 0, vx: 0, vy: 0,
        size: 2, color: '', life: 0, maxLife: 1,
        alpha: 1, gravity: 0, active: false
      };
      const angle = Math.random() * Math.PI * 2;
      const speed = (config.speedMin || 30) + Math.random() * ((config.speedMax || 120) - (config.speedMin || 30));
      const life = (config.lifeMin || 0.3) + Math.random() * ((config.lifeMax || 0.6) - (config.lifeMin || 0.3));
      p.x = x;
      p.y = y;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
      p.size = (config.sizeMin || 2) + Math.random() * ((config.sizeMax || 5) - (config.sizeMin || 2));
      p.color = config.color || CONFIG.COLORS.particle;
      p.life = life;
      p.maxLife = life;
      p.alpha = 1;
      p.gravity = config.gravity || 0;
      p.active = true;
      this.active.push(p);
    }
  },

  spawnExplosion(x, y, count) {
    this._spawn(x, y, count, {
      speedMin: 50, speedMax: 200,
      sizeMin: 3, sizeMax: 7,
      color: CONFIG.COLORS.particle,
      lifeMin: 0.3, lifeMax: 0.7,
      gravity: 100
    });
  },

  spawnHit(x, y, count) {
    this._spawn(x, y, count, {
      speedMin: 20, speedMax: 80,
      sizeMin: 1, sizeMax: 3,
      color: '#fff',
      lifeMin: 0.1, lifeMax: 0.3,
      gravity: 0
    });
  },

  spawnPowerUp(x, y) {
    this._spawn(x, y, 15, {
      speedMin: 30, speedMax: 100,
      sizeMin: 2, sizeMax: 5,
      color: '#fff',
      lifeMin: 0.2, lifeMax: 0.5,
      gravity: 0
    });
  },

  spawnBossExplosion(x, y) {
    this._spawn(x, y, 40, {
      speedMin: 80, speedMax: 300,
      sizeMin: 4, sizeMax: 10,
      color: CONFIG.COLORS.boss,
      lifeMin: 0.5, lifeMax: 1.0,
      gravity: 50
    });
  },

  render(ctx) {
    const scale = MobileSystem.getScale();
    for (const p of this.active) {
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x * scale, p.y * scale, p.size * scale, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },

  clear() {
    for (const p of this.active) { p.active = false; this.pool.push(p); }
    this.active.length = 0;
  }
};
</script>

<script>
// systems/scoreSystem.js - Score/combo/high score management
const ScoreSystem = {
  score: 0,
  combo: 0,
  maxCombo: 0,
  comboTimer: 0,
  comboTimeout: CONFIG.COMBO_TIMEOUT,
  highScore: 0,

  init() {
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.comboTimer = 0;
    this._loadHighScore();
  },

  update(dt) {
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.combo = 0;
      }
    }
  },

  addScore(amount) {
    this.score += amount;
    if (this.score > this.highScore) {
      this.highScore = this.score;
      this._saveHighScore();
    }
  },

  addCombo() {
    this.combo++;
    this.comboTimer = this.comboTimeout;
    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
  },

  getComboMultiplier() {
    if (this.combo < 5) return 1;
    if (this.combo < 15) return 1.5;
    if (this.combo < 30) return 2;
    return 3;
  },

  getScore() { return this.score; },
  getCombo() { return this.combo; },
  getMaxCombo() { return this.maxCombo; },
  getHighScore() { return this.highScore; },
  getComboTimer() { return this.comboTimer; },

  reset() {
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.comboTimer = 0;
  },

  _loadHighScore() {
    try {
      const val = localStorage.getItem('spaceShooter_highScore');
      if (val && Number.isFinite(Number(val))) this.highScore = Number(val);
    } catch (e) { /* ignore */ }
  },

  _saveHighScore() {
    try {
      localStorage.setItem('spaceShooter_highScore', String(this.highScore));
    } catch (e) { /* ignore */ }
  }
};
</script>

    EventBus.on('playerShieldBroken', () => { });
    EventBus.on('playerPowerUp', () => { });
    EventBus.on('waveTransition', () => { });
    EventBus.on('waveCleared', () => { });

    // Click handling for menus
    MobileSystem.canvas.addEventListener('click', (e) => this._handleClick(e));
    MobileSystem.canvas.addEventListener('touchend', (e) => {
      if (e.changedTouches.length > 0) {
        const t = e.changedTouches[0];
        this._handleClick({ clientX: t.clientX, clientY: t.clientY });
      }
    });
  },

  _handleClick(e) {
    const rect = MobileSystem.canvas.getBoundingClientRect();
    const scaleX = MobileSystem.getScale();
    const mx = (e.clientX - rect.left) / scaleX;
    const my = (e.clientY - rect.top) / scaleX;

    if (GameState === 'MENU') {
      this._checkMenuButton(mx, my);
    } else if (GameState === 'SHIP_SELECT') {
      this._checkShipSelectButton(mx, my);
    } else if (GameState === 'GAMEOVER' || GameState === 'VICTORY') {
      this._checkRestartButton(mx, my);
    } else if (GameState === 'PLAYING') {
      // Tap only (not drag) pauses the game
      if (!InputSystem.wasLastDrag()) GameState = 'PAUSE';
    } else if (GameState === 'PAUSE') {
      this._checkPauseButton(mx, my);
    }
  },

  _checkMenuButton(mx, my) {
    const cx = CONFIG.LOGICAL_WIDTH / 2;
    if (mx > cx - 100 && mx < cx + 100 && my > 615 && my < 675) {
      GameState = 'SHIP_SELECT';
    }
  },

  _checkShipSelectButton(mx, my) {
    const cx = CONFIG.LOGICAL_WIDTH / 2;
    const startY = 350;
    const shipHeight = 140;
    
    // Check each ship type button
    for (let i = 0; i < 3; i++) {
      const y = startY + i * shipHeight;
      if (mx > cx - 180 && mx < cx + 180 && my > y && my < y + shipHeight - 10) {
        const types = ['LASER', 'MISSILE', 'COMPANION'];
        selectedShipType = types[i];
        this._startGame();
        return;
      }
    }
    
    // Back button
    if (mx > cx - 100 && mx < cx + 100 && my > 780 && my < 840) {
      GameState = 'MENU';
    }
  },

  _checkRestartButton(mx, my) {
    const cx = CONFIG.LOGICAL_WIDTH / 2;
    if (mx > cx - 100 && mx < cx + 100 && my > 500 && my < 560) {
      this._startGame();
    }
  },

  _checkPauseButton(mx, my) {
    const cx = CONFIG.LOGICAL_WIDTH / 2;
    if (mx > cx - 100 && mx < cx + 100 && my > 400 && my < 460) {
      GameState = 'PLAYING';
    } else if (mx > cx - 100 && mx < cx + 100 && my > 470 && my < 530) {
      GameState = 'MENU';
    }
  },

  _startGame() {
    // Reset all systems
    PlayerSystem.reset();
    BulletSystem.clear();
    MissileSystem.clear();
    LaserSystem.clear();
    EnemySystem.clear();
    EnemyBulletSystem.clear();
    ParticleSystem.clear();
    PowerUpSystem.clear();
    BossSystem.reset();
    ScoreSystem.reset();
    SpawnSystem.reset();
    CameraSystem.shake(0, 0);
    GameState = 'PLAYING';
    WaveSystem.start();
  },

  render() {
    const scale = MobileSystem.getScale();
    const ctx = MobileSystem.ctx;

    ctx.save();
    ctx.scale(scale, scale);

    switch (GameState) {
      case 'MENU': this._renderMenu(); break;
      case 'SHIP_SELECT': this._renderShipSelect(); break;
      case 'PLAYING': this._renderHUD(); break;
      case 'PAUSE': this._renderPause(); break;
      case 'GAMEOVER': this._renderGameOver(); break;
      case 'VICTORY': this._renderVictory(); break;
    }

    ctx.restore();
  },

  _renderMenu() {
    const cx = CONFIG.LOGICAL_WIDTH / 2;
    const ctx = MobileSystem.ctx;

    // Title
    ctx.fillStyle = '#4fc3f7';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';

    ctx.fillText('POWER-UPS', cx, 360);

    const powerUps = [

    // Power-up timers

      ctx.fillText(`MISSILE ${PlayerSystem.missileTimer.toFixed(1)}s`, 16, timerY);

  _renderVictory() {
