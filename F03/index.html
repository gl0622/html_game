<script>
// core/loop.js - Game loop with fixed timestep
const Loop = {
  running: false,
  lastTime: 0,
  accumulator: 0,
  fixedDt: CONFIG.FIXED_DT,

  start() {
    this.running = true;
    this.lastTime = performance.now();
    this.accumulator = 0;
    requestAnimationFrame((t) => this._loop(t));
  },

  stop() {
    this.running = false;
  },

  _loop(timestamp) {
    if (!this.running) return;

    let dt = (timestamp - this.lastTime) / 1000;
    this.lastTime = timestamp;

    // Clamp dt to avoid spiral of death
    if (dt > 0.1) dt = 0.1;
    if (!Number.isFinite(dt)) dt = this.fixedDt;

    this.accumulator += dt;

    while (this.accumulator >= this.fixedDt) {
      this._update(this.fixedDt);
      this.accumulator -= this.fixedDt;
    }

    this._render();
    requestAnimationFrame((t) => this._loop(t));
  },

  _update(dt) {
    if (GameState !== 'PLAYING') return;

    // Emit update event for collision system
    EventBus.emit('update', { dt });

    BackgroundSystem.update(dt);
    CameraSystem.update(dt);
    InputSystem.update(dt);
    PlayerSystem.update(dt);
    BulletSystem.update(dt);
    MissileSystem.update(dt);
    LaserSystem.update(dt);
    EnemySystem.update(dt);
    EnemyBulletSystem.update(dt);
    PowerUpSystem.update(dt);
    ParticleSystem.update(dt);
    ScoreSystem.update(dt);
    WaveSystem.update(dt);
    SpawnSystem.update(dt);
    BossSystem.update(dt);

    // Auto-shoot
    if (PlayerSystem.isCanShoot()) {
      PlayerSystem.onShoot();
      BulletSystem.shoot(PlayerSystem.x, PlayerSystem.y);
      AudioSystem.playShoot();
    }

    // Ship type specific weapon firing
    if (PlayerSystem.shipType === 'LASER' && PlayerSystem.active) {
      const level = PlayerSystem.weaponLevel;
      if (PlayerSystem.laserCooldown <= 0) {
        PlayerSystem.laserCooldown = CONFIG.POWERUP_LASER_INTERVAL;
        // Fire based on level
        for (let i = 0; i < level; i++) {
          const offsetX = (i - (level - 1) / 2) * 20;
          LaserSystem.fire(PlayerSystem.x + offsetX, PlayerSystem.y);
        }
      }
    } else if (PlayerSystem.shipType === 'MISSILE' && PlayerSystem.active) {
      const level = PlayerSystem.weaponLevel;
      if (PlayerSystem.missileCooldown <= 0) {
        PlayerSystem.missileCooldown = CONFIG.POWERUP_MISSILE_INTERVAL;
        // Fire based on level
        for (let i = 0; i < level; i++) {
          const offsetX = (i - (level - 1) / 2) * 15;
          MissileSystem.spawn(PlayerSystem.x + offsetX, PlayerSystem.y - PlayerSystem.height / 2);
        }
      }
    } else if (PlayerSystem.shipType === 'COMPANION' && PlayerSystem.active) {
      // Update companion positions
      const time = Date.now() * 0.003;
      for (let i = 0; i < PlayerSystem.companions.length; i++) {
        const comp = PlayerSystem.companions[i];
        const angle = time + (i * Math.PI * 2 / PlayerSystem.companions.length);
        comp.x = PlayerSystem.x + Math.cos(angle) * 40;
        comp.y = PlayerSystem.y + Math.sin(angle) * 30 + 20;
        
        // Companions shoot
        if (comp.active && Math.random() < 0.05) {
          BulletSystem.spawn(comp.x, comp.y - 10, 0, -CONFIG.BULLET_SPEED);
        }
      }
    }

    // LASER power-up effect - any ship type can use laser when picked up
    if (PlayerSystem.laserTimer > 0 && PlayerSystem.active) {
      if (PlayerSystem.laserCooldown <= 0) {
        PlayerSystem.laserCooldown = CONFIG.POWERUP_LASER_INTERVAL;
        LaserSystem.fire(PlayerSystem.x, PlayerSystem.y);
      }
    }

    // MISSILE power-up effect - any ship type can use missile when picked up
    if (PlayerSystem.missileTimer > 0 && PlayerSystem.active) {
      if (PlayerSystem.missileCooldown <= 0) {
        PlayerSystem.missileCooldown = CONFIG.POWERUP_MISSILE_INTERVAL;
        MissileSystem.spawn(PlayerSystem.x, PlayerSystem.y - PlayerSystem.height / 2);
      }
    }
  },

  _render() {
    MobileSystem.clear();

    // Fixed render pipeline order
    const ctx = MobileSystem.ctx;

    // Apply camera transform
    CameraSystem.apply(ctx);

    BackgroundSystem.render(ctx);

    // Game objects only render during gameplay states
    if (GameState === 'PLAYING' || GameState === 'PAUSE') {
      EnemySystem.render(ctx);
      EnemyBulletSystem.render(ctx);
      PlayerSystem.render(ctx);
      BulletSystem.render(ctx);
      MissileSystem.render(ctx);
      LaserSystem.render(ctx);
      PowerUpSystem.render(ctx);
      ParticleSystem.render(ctx);
      BossSystem.render(ctx);
    }

    CameraSystem.restore(ctx);

    // UI renders on top (unaffected by camera)
    UISystem.render();
  }
};
</script>

<!-- ===== GameCore ===== -->
<script>
// core/gameCore.js - Game lifecycle, state machine, initialization
let GameState = 'MENU'; // MENU / SHIP_SELECT / PLAYING / PAUSE / GAMEOVER / VICTORY
let selectedShipType = 'LASER'; // Default ship type

const GameCore = {
  init() {
    // Initialize systems in dependency order
    MobileSystem.init(document.getElementById('gameCanvas'));
    AudioSystem.init();
    BackgroundSystem.init();
    CameraSystem.init();
    InputSystem.init();
    PlayerSystem.init();
    BulletSystem.init();
    MissileSystem.init();
    LaserSystem.init();
    EnemySystem.init();
    EnemyBulletSystem.init();
    CollisionSystem.init();
    SpawnSystem.init();
    BossSystem.init();
    WaveSystem.init();
    PowerUpSystem.init();
    ParticleSystem.init();
    ScoreSystem.init();
    UISystem.init();

    // Keyboard pause/resume
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        if (GameState === 'PLAYING') GameState = 'PAUSE';
        else if (GameState === 'PAUSE') GameState = 'PLAYING';
      }
      if (e.code === 'Enter' || e.code === 'Space') {
        if (GameState === 'MENU') {
          UISystem._startGame();
        } else if (GameState === 'GAMEOVER' || GameState === 'VICTORY') {
          UISystem._startGame();
        }
      }
      AudioSystem.resume();
    });

    // Resume audio on touch
    window.addEventListener('touchstart', () => AudioSystem.resume(), { once: true });
    window.addEventListener('mousedown', () => AudioSystem.resume(), { once: true });

    Loop.start();
  }
};

// Boot
window.addEventListener('DOMContentLoaded', () => GameCore.init());
</script>
